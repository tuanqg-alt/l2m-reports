<style>
:root { --topbar-h: 52px; --ncv-bg: #0F1419; --ncv-orange: #EE5524;
  --ncv-card: #161D27; --ncv-text: #E8EAED; --ncv-muted: #9BA3AF; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--ncv-bg);
  -webkit-text-size-adjust: 100%; }
.topbar { display: flex; align-items: center; height: var(--topbar-h);
  background: var(--ncv-bg); border-bottom: 2px solid var(--ncv-orange);
  padding: 0 18px; position: relative; z-index: 100;
  box-shadow: 0 1px 8px rgba(0,0,0,.35); gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; white-space: nowrap; }
.ncv-brand-mark { font-family: 'Sora', -apple-system, 'Segoe UI', sans-serif; font-weight: 800;
  font-size: 15px; color: #fff; letter-spacing: .02em; }
.ncv-brand-mark .v { color: var(--ncv-orange); }
.ncv-brand-mark .games { color: #fff; font-weight: 600; letter-spacing: .16em; font-size: 11px; margin-left: 3px; }
.eyebrow { font-family: 'JetBrains Mono', monospace; color: var(--ncv-orange); text-transform: uppercase;
  letter-spacing: .14em; font-size: 10.5px; font-weight: 500;
  border-left: 1px solid rgba(255,255,255,.18); padding-left: 10px; }
.tabs { display: flex; gap: 4px; flex: 1 1 auto; overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tbtn { padding: 7px 18px; font-size: 12.5px; font-weight: 600; color: var(--ncv-muted);
  flex: 0 0 auto; background: transparent; border: 1px solid transparent; border-radius: 7px;
  cursor: pointer; transition: all .15s; font-family: 'Inter', -apple-system, sans-serif;
  white-space: nowrap; }
.tbtn:hover { background: #1C2533; color: var(--ncv-text); }
.tbtn.active { background: rgba(238,85,36,.14); border-color: var(--ncv-orange);
  color: var(--ncv-orange); }
.tbtn .ic { margin-right: 6px; }
.info { margin-left: auto; font-size: 11px; color: #6B7280; flex: 0 0 auto; white-space: nowrap;
  font-family: 'JetBrains Mono', monospace; }
.pane { display: none; width: 100%; height: calc(100vh - var(--topbar-h));
  height: calc(100dvh - var(--topbar-h)); }
.pane.active { display: block; }
.pane iframe { width: 100%; height: 100%; border: none; display: block; background: var(--ncv-bg); }
@media (max-width: 640px) {
  :root { --topbar-h: 46px; }
  .topbar { padding: 0 12px; gap: 8px; }
  .ncv-brand-mark { font-size: 13px; }
  .eyebrow { display: none; }
  .info { display: none; }
  .tbtn { padding: 6px 13px; font-size: 11px; }
  .tbtn .ic { margin-right: 4px; }
}
</style>
</head>

  function decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: "text/html;charset=utf-8" }));
  }
  function load(id) {
    if (done[id]) return;
    done[id] = 1;
    if (!urls[id]) urls[id] = decode(S[id]);

  }
  function sw(id, btn) {
    document.querySelectorAll('.pane').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.tbtn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('p-' + id).classList.add('active');
    btn.classList.add('active');
    load(id);
  }
  window.sw = sw;
  load('mkt');
