/* NCV Design System v1.0 — Inline */
:root {
  --bg-primary: #0F1419;
  --bg-card: #161D27;
  --bg-card-hover: #1C2533;
  --border: rgba(255,255,255,0.08);
  --border-accent: rgba(238,85,36,0.3);
  --text-primary: #E8EAED;
  --text-secondary: #9BA3AF;
  --text-muted: #6B7280;
  --orange: #EE5524;
  --orange-dim: rgba(238,85,36,0.12);
  --green: #22C55E;
  --green-dim: rgba(34,197,94,0.12);
  --yellow: #F59E0B;
  --yellow-dim: rgba(245,158,11,0.12);
  --blue: #3B82F6;
  --blue-dim: rgba(59,130,246,0.12);
  --font-heading: 'Sora', sans-serif;
  --font-body: 'Inter', sans-serif;
  --radius: 8px;
  --radius-sm: 4px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 1440px; margin: 0 auto; padding: 28px 24px; }

/* Header */
.header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
}
.header-left h1 {
  font-family: var(--font-heading); font-size: 22px; font-weight: 700;
}
.header-left h1 span { color: var(--orange); }
.header-left .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.last-updated {
  font-size: 12px; color: var(--text-muted);
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 14px; white-space: nowrap;
  align-self: flex-start;
}

/* Summary */
.summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 24px; }

/* Monthly section */
.monthly-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 18px; overflow: hidden; }
.monthly-section-header { padding: 14px 20px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.monthly-section-header h3 { font-family: var(--font-heading); font-size: 13px; font-weight: 600; color: var(--text-primary); }
.monthly-section-header .note { font-size: 11px; color: var(--text-muted); }
.monthly-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.monthly-table th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; padding: 9px 16px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.monthly-table td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.monthly-table tr:last-child td { border-bottom: none; }
.monthly-table tr.ytd-row td { background: var(--orange-dim); font-weight: 600; }
.monthly-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.ratio-pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.ratio-pill.paid  { background: var(--green-dim); color: var(--green); }
.ratio-pill.appr  { background: var(--orange-dim); color: var(--orange); }
.ratio-pill.zero  { color: var(--text-muted); }
.mkt-paid   { color: var(--green); font-weight: 600; }
.mkt-appr   { color: var(--orange); }
.mkt-zero   { color: var(--text-muted); font-style: italic; }
.summary-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
}
.summary-card.accent { border-color: var(--border-accent); }
.summary-card .label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-muted); font-weight: 600; margin-bottom: 8px;
}
.summary-card .value {
  font-family: var(--font-heading); font-size: 26px; font-weight: 700;
}
.summary-card.accent .value { color: var(--orange); }
.summary-card .sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* Filter */
.filter-bar {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px;
  margin-bottom: 18px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
}
.filter-group { display: flex; align-items: center; gap: 8px; }
.filter-group label {
  font-size: 11px; color: var(--text-muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
}
.filter-group select {
  background: var(--bg-primary); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text-primary);
  padding: 6px 10px; font-family: var(--font-body); font-size: 13px;
  cursor: pointer; outline: none;
}
.filter-group select:focus { border-color: var(--orange); }
.record-count { margin-left: auto; font-size: 12px; color: var(--text-muted); }

/* Table */
.table-wrap {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--bg-primary); color: var(--text-muted);
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .07em; padding: 11px 14px; text-align: left;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover:not(.campaign-header):not(.subtotal-row) { background: var(--bg-card-hover); }
tbody td { padding: 10px 14px; vertical-align: middle; }

/* Campaign header row */
tr.campaign-header td {
  padding: 10px 14px 8px;
  background: rgba(255,255,255,0.025);
  font-family: var(--font-heading); font-weight: 600;
  font-size: 13px; color: var(--text-primary);
  border-top: 1px solid rgba(238,85,36,0.25);
}

/* Subtotal row */
tr.subtotal-row td {
  background: rgba(238,85,36,0.05);
  font-size: 12px; font-weight: 600; color: var(--orange);
  padding: 8px 14px;
}

/* Badges */
.plan-code {
  font-family: 'Courier New', monospace; font-size: 11.5px;
  color: var(--text-secondary); background: rgba(255,255,255,0.05);
  padding: 2px 7px; border-radius: 3px; white-space: nowrap;
}
.market-badge {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-weight: 700; letter-spacing: .05em;
}
.m-VN  { background: rgba(255,193,7,.15);  color: #FFC107; }
.m-TH  { background: rgba(59,130,246,.15); color: #60A5FA; }
.m-ID  { background: rgba(239,68,68,.15);  color: #F87171; }
.m-PH  { background: rgba(168,85,247,.15); color: #C084FC; }
.m-SG  { background: rgba(20,184,166,.15); color: #2DD4BF; }
.m-MY  { background: rgba(34,197,94,.15);  color: #4ADE80; }
.m-SEA { background: var(--orange-dim);    color: var(--orange); }

.type-badge { display: inline-block; padding: 2px 9px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.t-digital  { background: var(--blue-dim);  color: #60A5FA; }
.t-giftcard { background: var(--green-dim); color: var(--green); }
.t-kol      { background: rgba(168,85,247,.12); color: #C084FC; }
.t-vendor   { background: var(--yellow-dim); color: var(--yellow); }

.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.s-pending  { background: var(--yellow-dim); color: var(--yellow); }
.s-approved { background: var(--green-dim);  color: var(--green); }
.s-paid     { background: var(--blue-dim);   color: #60A5FA; }
.s-running  { background: var(--orange-dim); color: var(--orange); }

/* Number cells */
.num { text-align: right; font-variant-numeric: tabular-nums; }
.c-green  { color: var(--green); }
.c-yellow { color: var(--yellow); }
.c-muted  { color: var(--text-muted); font-style: italic; }
.c-secondary { color: var(--text-secondary); }

/* Notes tooltip */
.note-icon { cursor: default; color: var(--text-muted); font-size: 13px; }
.note-icon[title]:hover { color: var(--orange); }

/* Footer */
.footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted); }
.footer a { color: var(--orange); text-decoration: none; }

/* Responsive */
@media (max-width: 900px) {
  .summary-grid { grid-template-columns: repeat(2,1fr) !important; }
  .monthly-table th:nth-child(3),.monthly-table td:nth-child(3),
  .monthly-table th:nth-child(6),.monthly-table td:nth-child(6) { display: none; }
}
@media (max-width: 640px) {
  .summary-grid { grid-template-columns: 1fr !important; }
}
@media (max-width: 900px) { .summary-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 600px) {
  .summary-grid { grid-template-columns: 1fr; }
  .filter-bar { flex-direction: column; align-items: flex-start; }
  .header { flex-direction: column; }
}
</style>

const $ = id => document.getElementById(id);
const fmt = n => n != null
  ? '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})
  : '<span class="c-muted">—</span>';

const TYPE_META  = { digital:'Digital Ads', giftcard:'Giftcard/Reward', kol:'PR/KOL', vendor:'Vendor/Branding' };
const STATUS_META = {
  pending:  { label: '⏳ Pending',  cls: 's-pending' },
  approved: { label: '✅ Approved', cls: 's-approved' },
  paid:     { label: '💳 Paid',     cls: 's-paid' },
  running:  { label: '▶ Running',   cls: 's-running' }
};

function filteredCampaigns() {
  const ft = $('fType').value;
  const fm = $('fMarket').value;
  const fs = $('fStatus').value;
  return CAMPAIGNS.map(c => {
    const plans = c.plans.filter(p =>
      (!ft || p.type === ft) &&
      (!fm || p.market === fm || p.market === 'SEA') &&
      (!fs || p.status === fs)
    );
    return plans.length ? { ...c, plans } : null;
  }).filter(Boolean);
}

function renderSummary(campaigns) {
  const allPlans = campaigns.flatMap(c => c.plans);
  // All CAMPAIGNS (unfiltered) for global totals
  const allPlansGlobal = CAMPAIGNS.flatMap(c => c.plans);

  const totalApproved = allPlansGlobal.filter(p => ['approved','paid','running'].includes(p.status))
    .reduce((s,p) => s + (p.afterTax||0), 0);
  const pendingAmt = allPlansGlobal.filter(p => p.status === 'pending')
    .reduce((s,p) => s + (p.afterTax||0), 0);
  const paidMkt = allPlansGlobal.filter(p => p.status === 'paid')
    .reduce((s,p) => s + (p.actual||0), 0);
  const approvedCount = allPlansGlobal.filter(p => ['approved','paid','running'].includes(p.status)).length;
  const pendingCount  = allPlansGlobal.filter(p => p.status === 'pending').length;

  const grossYTD = Object.values(GROSS_REVENUE).reduce((s,m) => s + m.usd, 0);
  const paidRatio = grossYTD > 0 ? (paidMkt / grossYTD * 100) : 0;
  const apprRatio = grossYTD > 0 ? (totalApproved / grossYTD * 100) : 0;

  $('summaryGrid').innerHTML = `
    <div class="summary-card" style="border-color:rgba(59,130,246,0.35)">
      <div class="label">Gross Revenue YTD 2026</div>
      <div class="value" style="color:var(--blue)">$${Math.round(grossYTD).toLocaleString('en-US')}</div>
      <div class="sub">Jan–May · Source: KB GameOps (FX 25,255 VND/USD)</div>
    </div>
    <div class="summary-card" style="border-color:rgba(34,197,94,0.35)">
      <div class="label">Paid MKT YTD</div>
      <div class="value" style="color:var(--green)">$${Math.round(paidMkt).toLocaleString('en-US')}</div>
      <div class="sub">${allPlansGlobal.filter(p=>p.status==='paid').length} plan đã thanh toán</div>
    </div>
    <div class="summary-card" style="border-color:rgba(34,197,94,0.2)">
      <div class="label">Paid MKT / Gross Rev</div>
      <div class="value" style="color:var(--green)">${paidRatio.toFixed(2)}%</div>
      <div class="sub">Approved budget / Rev: <strong style="color:var(--orange)">${apprRatio.toFixed(2)}%</strong></div>
    </div>
    <div class="summary-card accent">
      <div class="label">Total Approved MKT Budget</div>
      <div class="value">$${Math.round(totalApproved).toLocaleString('en-US')}</div>
      <div class="sub">${approvedCount} plan đã duyệt (after tax)</div>
    </div>
    <div class="summary-card">
      <div class="label">Pending Approval</div>
      <div class="value" style="color:var(--yellow)">$${Math.round(pendingAmt).toLocaleString('en-US')}</div>
      <div class="sub">${pendingCount} plan chờ duyệt</div>
    </div>
    <div class="summary-card">
      <div class="label">Campaigns Tracked</div>
      <div class="value">${CAMPAIGNS.length}</div>
      <div class="sub">${allPlansGlobal.length} plan codes · ${[...new Set(allPlansGlobal.map(p=>p.market))].length} markets</div>
    </div>`;
}

function renderTable(campaigns) {
  let html = '';
  let totalPlans = 0;

  campaigns.forEach(c => {
    totalPlans += c.plans.length;
    const firstType = c.plans[0].type;
    const typeCls = 't-' + firstType;
    const typeLabel = TYPE_META[firstType] || firstType;

    // Campaign header
    html += `<tr class="campaign-header">
      <td colspan="13">
        ${c.name}&nbsp;&nbsp;<span class="type-badge ${typeCls}">${typeLabel}</span>
      </td>
    </tr>`;

    c.plans.forEach(p => {
      const sm = STATUS_META[p.status] || { label: p.status, cls: '' };
      const variance = (p.actual != null && p.afterTax != null)
        ? (p.actual - p.afterTax) : null;
      const varHtml = variance != null
        ? `<span class="${variance <= 0 ? 'c-green' : 'c-yellow'}">${variance <= 0 ? '−' : '+'}$${Math.abs(variance).toFixed(2)}</span>`
        : '<span class="c-muted">—</span>';
      const noteHtml = p.notes
        ? `<span class="note-icon" title="${p.notes}">💬</span>`
        : '';

      html += `<tr data-type="${p.type}" data-market="${p.market}" data-status="${p.status}">
        <td></td>
        <td><span class="plan-code">${p.code}</span></td>
        <td></td>
        <td><span class="market-badge m-${p.market}">${p.market}</span></td>
        <td class="num c-secondary">${p.beforeTax != null ? fmt(p.beforeTax) : '<span class="c-muted">—</span>'}</td>
        <td class="num">${fmt(p.afterTax)}</td>
        <td class="num c-green">${p.actual != null ? fmt(p.actual) : '<span class="c-muted">—</span>'}</td>
        <td class="num">${varHtml}</td>
        <td style="font-size:12px;color:var(--text-secondary)">${p.period}</td>
        <td><span class="status-badge ${sm.cls}">${sm.label}</span></td>
        <td style="font-size:12px">${p.approvedBy}</td>
        <td style="font-size:12px;color:var(--text-secondary);white-space:nowrap">${p.approvedDate}</td>
        <td>${noteHtml}</td>
      </tr>`;
    });

    // Subtotal (only if >1 plan in campaign)
    if (c.plans.length > 1) {
      const sub = c.plans.reduce((s,p) => s + (p.afterTax||0), 0);
      const subActual = c.plans.reduce((s,p) => s + (p.actual||0), 0);
      html += `<tr class="subtotal-row">
        <td colspan="4" style="text-align:right;padding-right:14px;font-size:11px;color:var(--text-muted)">
          SUBTOTAL — ${c.plans.length} markets
        </td>
        <td class="num">${fmt(c.plans.reduce((s,p)=>s+(p.beforeTax||0),0))}</td>
        <td class="num">${fmt(sub)}</td>
        <td class="num">${subActual > 0 ? fmt(subActual) : '<span class="c-muted">—</span>'}</td>
        <td colspan="6"></td>
      </tr>`;
    }
  });

  $('tbody').innerHTML = html;
  $('rowCount').textContent = `${totalPlans} record${totalPlans !== 1 ? 's' : ''}`;
}

function renderMonthly() {
  const months = Object.keys(GROSS_REVENUE).sort();
  const fmtK = n => n >= 1000000
    ? '$' + (n/1000000).toFixed(2) + 'M'
    : n > 0 ? '$' + n.toLocaleString('en-US', {minimumFractionDigits:0}) : '—';

  const ytdRev = months.reduce((s,m) => s + GROSS_REVENUE[m].usd, 0);
  const ytdPaid = months.reduce((s,m) => s + (MONTHLY_MKT[m]?.paid||0), 0);
  const ytdAppr = months.reduce((s,m) => s + (MONTHLY_MKT[m]?.approved||0), 0);

  let rows = months.map(m => {
    const rev = GROSS_REVENUE[m].usd;
    const paid = MONTHLY_MKT[m]?.paid || 0;
    const appr = MONTHLY_MKT[m]?.approved || 0;
    const paidRatio = rev > 0 && paid > 0 ? (paid/rev*100).toFixed(3)+'%' : null;
    const apprRatio = rev > 0 && appr > 0 && appr !== paid ? (appr/rev*100).toFixed(3)+'%' : null;

    return `<tr>
      <td style="font-weight:600;white-space:nowrap">${GROSS_REVENUE[m].label}</td>
      <td style="font-variant-numeric:tabular-nums"><span style="color:var(--blue);font-weight:600">${fmtK(rev)}</span> <span style="font-size:11px;color:var(--text-muted)">(${GROSS_REVENUE[m].bvnd}B VND)</span></td>
      <td class="num">${paid > 0 ? '<span class="mkt-paid">'+fmtK(paid)+'</span>' : '<span class="mkt-zero">—</span>'}</td>
      <td class="num">${appr > 0 && appr !== paid ? '<span class="mkt-appr">'+fmtK(appr)+'</span>' : (paid > 0 ? '<span style="color:var(--text-muted);font-size:11px">(same)</span>' : '<span class="mkt-zero">—</span>')}</td>
      <td class="num">${paidRatio ? '<span class="ratio-pill paid">'+paidRatio+'</span>' : '<span class="ratio-pill zero">—</span>'}</td>
      <td class="num">${apprRatio ? '<span class="ratio-pill appr">'+apprRatio+'</span>' : (paidRatio ? '<span class="ratio-pill appr">'+paidRatio+'</span>' : '<span class="ratio-pill zero">—</span>')}</td>
    </tr>`;
  }).join('');

  // YTD row
  const ytdPaidRatio = ytdRev > 0 && ytdPaid > 0 ? (ytdPaid/ytdRev*100).toFixed(3)+'%' : '—';
  const ytdApprRatio = ytdRev > 0 && ytdAppr > 0 ? (ytdAppr/ytdRev*100).toFixed(3)+'%' : '—';
  rows += `<tr class="ytd-row">
    <td style="font-weight:700">YTD Total</td>
    <td><span style="color:var(--blue);font-weight:700">${fmtK(ytdRev)}</span></td>
    <td class="num"><span class="mkt-paid">${fmtK(ytdPaid)}</span></td>
    <td class="num"><span class="mkt-appr">${fmtK(ytdAppr)}</span></td>
    <td class="num"><span class="ratio-pill paid">${ytdPaidRatio}</span></td>
    <td class="num"><span class="ratio-pill appr">${ytdApprRatio}</span></td>
  </tr>`;

  $('monthlySection').innerHTML = `
    <div class="monthly-section">
      <div class="monthly-section-header">
        <h3>📊 Monthly MKT vs Gross Revenue — Jan → May 2026</h3>
        <span class="note">Source: KB GameOps (FX 1 USD = 25,255 VND) · Paid only = actual invoiced</span>
      </div>
      <table class="monthly-table">
        <thead>
          <tr>
            <th>Month</th>
            <th>Gross Revenue</th>
            <th class="num">Paid MKT</th>
            <th class="num">Approved MKT Budget</th>
            <th class="num">Paid / Rev</th>
            <th class="num">Approved / Rev</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function render() {
  const campaigns = filteredCampaigns();
  renderSummary(campaigns);
  renderMonthly();
  renderTable(campaigns);
}

// Init
document.getElementById('tsLabel').textContent = LAST_UPDATED;
render();
</script>
</body>
</html>
