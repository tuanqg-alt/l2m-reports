<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L2M Report Hub — NCV Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--brand-dark:#0F1419;--accent:#EE5524;--accent-h:#D44A1F;--accent-soft:#FFE8DD;
      --n900:#0F1419;--n800:#1A1D24;--n700:#2A2E37;--n600:#4A4F5A;--n500:#6B7280;
      --n400:#9CA3AF;--n300:#D1D5DB;--n200:#E5E7EB;--n100:#F3F4F6;--n50:#F9FAFB;
      --diamond:#3FB6D4;--white:#fff;
      --fh:'Sora',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono',Consolas,monospace}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--fb);background:var(--n100);color:var(--n800);min-height:100vh;line-height:1.6}
    .wrap{max-width:1200px;margin:0 auto;padding:0 40px}
    /* hero */
    .hero{background:var(--brand-dark);color:#fff;padding:34px 0 30px}
    .hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
    .eyebrow{font-family:var(--fm);color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:500}
    .ncv-brand-mark{font-family:var(--fh);font-weight:800;letter-spacing:.02em;font-size:15px;color:#fff}
    .ncv-brand-mark .v{color:var(--accent)}
    .ncv-brand-mark .games{color:#fff;margin-left:4px;font-weight:600;letter-spacing:.16em;font-size:12px}
    .hero h1{font-family:var(--fh);font-weight:800;font-size:30px;margin:12px 0 6px;letter-spacing:-.01em}
    .sub{color:var(--n300);font-size:14px;max-width:760px}
    .banner{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    .chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:8px;padding:7px 13px;font-size:12.5px;color:#E5E7EB}
    .chip b{color:#fff}
    /* control bar */
    .ctrl{background:#fff;border-bottom:1px solid var(--n200);padding:12px 0;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .ctrl-in{max-width:1200px;margin:0 auto;padding:0 40px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    .sw{position:relative;flex:1;min-width:200px;max-width:340px}
    .sw input{width:100%;background:var(--n50);border:1px solid var(--n200);
               border-radius:8px;padding:8px 12px 8px 34px;font:14px var(--fb);
               color:var(--n800);outline:none;transition:border-color .2s,background .2s}
    .sw input::placeholder{color:var(--n400)}
    .sw input:focus{border-color:var(--accent);background:#fff}
    .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);
         color:var(--n400);font-size:14px;pointer-events:none}
    .tabs{display:flex;gap:6px;flex-wrap:wrap}
    .tab{padding:6px 14px;border-radius:20px;border:1px solid var(--n200);
          background:#fff;color:var(--n500);font:600 12px var(--fb);
          cursor:pointer;transition:all .15s;white-space:nowrap}
    .tab:hover{border-color:var(--n300);color:var(--n800);background:var(--n50)}
    .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
    /* language switch */
    .langsw{display:inline-flex;margin-left:auto;border:1px solid var(--n200);
             border-radius:8px;overflow:hidden;flex-shrink:0}
    .langbtn{padding:7px 12px;background:#fff;border:0;color:var(--n500);
              font:700 12px var(--fm);cursor:pointer;transition:all .15s}
    .langbtn+.langbtn{border-left:1px solid var(--n200)}
    .langbtn:hover{background:var(--n50);color:var(--n800)}
    .langbtn.active{background:var(--accent);color:#fff}
    /* main */
    .main{max-width:1200px;margin:0 auto;padding:28px 40px 70px}
    .sec{margin-bottom:34px}
    .sec-hdr{display:flex;align-items:center;gap:9px;margin-bottom:14px;
              padding-bottom:9px;border-bottom:1px solid var(--n200)}
    .sec-num{font-family:var(--fm);font-weight:700;font-size:11px;color:var(--accent);
              letter-spacing:.04em;background:var(--accent-soft);padding:3px 8px;border-radius:5px;flex-shrink:0}
    .sec-title{font:700 14px var(--fh);color:var(--n900)}
    .sec-cnt{font-size:12px;color:var(--n600);background:var(--n100);padding:2px 9px;border-radius:10px;font-weight:600}
    /* pinned cards */
    .pins-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
    .pcard{background:#fff;border:1px solid var(--n200);border-radius:12px;
            padding:13px 15px;cursor:pointer;text-decoration:none;
            display:flex;align-items:center;gap:12px;transition:all .18s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .pcard:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(238,85,36,.15);transform:translateY(-1px)}
    .pcard-icon{font-size:18px;flex-shrink:0;width:38px;height:38px;display:flex;
                 align-items:center;justify-content:center;background:var(--accent-soft);border-radius:9px}
    .pcard-title{font:700 13px/1.3 var(--fh);color:var(--n900)}
    .pcard-area{font-size:11px;color:var(--n500);margin-top:2px}
    /* report cards */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .card{background:#fff;border:1px solid var(--n200);border-radius:12px;
           padding:15px 17px;cursor:pointer;transition:all .18s;
           display:flex;flex-direction:column;gap:10px;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 18px rgba(238,85,36,.13)}
    .ct{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .ctitle{font:700 13px/1.4 var(--fh);flex:1;color:var(--n900)}
    .bdg{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
          padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0}
    .cf{display:flex;align-items:center;justify-content:space-between}
    .cdate{font-size:11px;color:var(--n500);display:flex;align-items:center;gap:7px;font-family:var(--fm)}
    .scopetag{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
               color:var(--n600);background:var(--n100);padding:2px 6px;border-radius:4px;font-family:var(--fb)}
    .copn{font-size:11px;color:var(--accent);font-weight:700;opacity:0;transition:opacity .15s}
    .card:hover .copn{opacity:1}
    /* skill cards */
    .scard{background:#fff;border:1px solid var(--n200);border-radius:12px;padding:15px 17px;
            display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:all .18s}
    .scard:hover{border-color:var(--accent);box-shadow:0 4px 18px rgba(238,85,36,.13);transform:translateY(-2px)}
    .scard-top{display:flex;align-items:flex-start;gap:11px}
    .scard-icon{font-size:18px;flex-shrink:0;width:38px;height:38px;display:flex;align-items:center;
                 justify-content:center;background:var(--accent-soft);border-radius:9px}
    .scard-title{font:700 13px/1.3 var(--fh);color:var(--n900)}
    .scard-meta{font-size:10.5px;color:var(--n500);margin-top:3px;font-family:var(--fm)}
    .scard-desc{font-size:12px;color:var(--n600);line-height:1.5}
    .scard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:2px}
    .scard-size{font-size:11px;color:var(--n400);font-family:var(--fm)}
    .dl{background:var(--accent);color:#fff;font:700 12px var(--fb);text-decoration:none;
         padding:8px 15px;border-radius:8px;transition:background .15s;white-space:nowrap}
    .dl:hover{background:var(--accent-h)}
    .empty{text-align:center;padding:60px 20px;color:var(--n500)}
    .empty .ei{font-size:44px;margin-bottom:10px}
    @media(max-width:768px){
      .wrap,.ctrl-in,.main{padding-left:20px;padding-right:20px}
      .hero h1{font-size:24px}
      .langsw{margin-left:0}
    }
  </style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="hero-top">
    <span class="eyebrow">L2M · Internal Analytics Hub</span>

  <h1>L2M Report Hub</h1>

</div></header>
<div class="ctrl">

</div>
<main class="main" id="main"></main>
<script>

const SKILLS = [

    "area": "03",

    "icon": "📖",
    "description": "Tra cứu thuật ngữ chính thức Lineage2M — Hàn ↔ Việt, Anh, Thái, Indo (44.225 từ, có sẵn trong skill, không cần workspace). Cứ hỏi Claude 'từ X tiếng Việt là gì' là ra ngay.",
    "description_en": "Official Lineage2M term lookup — Korean ↔ Vietnamese, English, Thai, Indonesian (44,225 terms built into the skill, no workspace needed). Just ask Claude what the Vietnamese/English for a term is and get the answer instantly.",

  {

    "description": "⚠️ Cần cài THÊM skill 'L2M Glossary' (cùng Hub) để có dữ liệu thuật ngữ. Quy trình 8 giai đoạn dịch game từ tiếng Anh sang Việt/Thái/Indonesia bằng AI có kiểm soát: Glossary-first Draft A → QA kỹ thuật → Style Audit A+ → QA cuối → Human Review → Final. Kèm checklist severity P0-P3, style guide riêng từng ngôn ngữ đích, và 6 mẫu prompt tái sử dụng.",
    "description_en": "⚠️ Requires the 'L2M Glossary' skill (same Hub) installed alongside it for terminology data. An 8-stage controlled AI localization pipeline translating game content from English into Vietnamese/Thai/Indonesian: Glossary-first Draft A → Technical QA → Controlled Style Audit A+ → Final QA → Human Review → Final. Includes P0-P3 severity checklists, per-language style guides, and 6 reusable prompt templates.",

  },
  {
    "id": "wording-vn",

    "area": "_framework",

    "icon": "✍️",
    "description": "Nhận một đoạn văn tiếng Việt do AI viết và gọt lại cho tự nhiên, cô đọng, giữ nguyên 100% nội dung. Có script chấm điểm 'mùi AI' 0-100 để đo trước/sau, không nói cảm tính. Kèm 10 luật viết + bảng 8 nhóm cụm từ lộ AI và bản thay thế. Kèm 22 ca kiểm chứng để mỗi lần chỉnh pattern là biết ngay có làm hỏng chỗ khác không. Pilot tiếng Việt, khung đã chừa chỗ cắm thêm ngôn ngữ khác.",
    "description_en": "Takes Vietnamese text written by AI and rewrites it to read naturally and concisely while keeping 100% of the content. Ships with a 0-100 'AI-ness' scorer so before/after is measured, not guessed, plus 10 writing rules and a table of 8 AI-tell phrase groups with replacements. Vietnamese pilot; the structure is ready for more languages.",
    "version": "1.1",
    "updated": "2026-08-28",
    "zip": "skills/wording-vn.zip",
    "size_kb": 25.7
  }
];
const I18N = {
  "vi": {
    "heroSub": "Trung tâm báo cáo nội bộ — Analytics & Intelligence cho Lineage2M SEA. Chọn khu vực ở thanh lọc hoặc gõ tìm kiếm để mở báo cáo.",
    "searchPh": "Tìm báo cáo…",
    "tabMaster": "Nổi bật",
    "tabSkills": "Kỹ năng",
    "tabOther": "Khác",
    "chipReports": "báo cáo",
    "chipPinned": "nổi bật",
    "chipUpdated": "Cập nhật:",
    "secPinned": "Báo cáo nổi bật",
    "secSkills": "Tải về & dùng lại",
    "open": "Mở →",
    "download": "⬇ Tải skill",
    "area": "Khu vực",
    "emptyPinned": "Chưa có báo cáo nổi bật.",
    "emptyReports": "Không tìm thấy báo cáo.",
    "emptySkills": "Không tìm thấy skill."
  },
  "en": {
    "heroSub": "Internal report hub — Analytics & Intelligence for Lineage2M SEA. Pick an area from the filter bar or type to search for a report.",
    "searchPh": "Search reports…",
    "tabMaster": "Master",
    "tabSkills": "Skills",
    "tabOther": "Other",
    "chipReports": "reports",
    "chipPinned": "pinned",
    "chipUpdated": "Updated:",
    "secPinned": "Pinned Reports",
    "secSkills": "Download & reuse",
    "open": "Open →",
    "download": "⬇ Download skill",
    "area": "Area",
    "emptyPinned": "No pinned reports yet.",
    "emptyReports": "No reports found.",
    "emptySkills": "No skills found."
  }
};
let activeArea = 'all', query = '';
let lang = 'vi';
try { lang = localStorage.getItem('hubLang') || 'vi'; } catch (e) { lang = 'vi'; }
if (!I18N[lang]) lang = 'vi';

function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.vi[key] || key; }

function applyStaticText() {
  document.documentElement.lang = lang;
  const q  = document.getElementById('q');            if (q)  q.placeholder = t('searchPh');
  const hs = document.getElementById('hero-sub');     if (hs) hs.textContent = t('heroSub');
  const cr = document.getElementById('chip-reports'); if (cr) cr.textContent = t('chipReports');
  const cp = document.getElementById('chip-pinned');  if (cp) cp.textContent = t('chipPinned');
  const cu = document.getElementById('chip-updated'); if (cu) cu.textContent = t('chipUpdated');
  document.querySelectorAll('.langbtn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}

function renderTabs() {
  const pinCount   = REPORTS.filter(r => r.pinned).length;
  const otherCount = REPORTS.filter(r => !r.pinned).length;
  const tabs = [
    {id:'all', label:`📌 ${t('tabMaster')} (${pinCount})`},
  ];
  if (SKILLS.length) tabs.push({id:'skills', label:`🧩 ${t('tabSkills')} (${SKILLS.length})`});
  tabs.push({id:'other', label:`📁 ${t('tabOther')} (${otherCount})`});
  document.getElementById('tabs').innerHTML = tabs
    .map(tb => `<button class="tab${activeArea===tb.id?' active':''}" data-id="${tb.id}">${tb.label}</button>`)
    .join('');
  document.querySelectorAll('.tab').forEach(b =>
    b.addEventListener('click', () => { activeArea = b.dataset.id; render(); }));
}

function getFiltered() {
  const q    = query.toLowerCase();
  const pool = activeArea === 'all'
    ? REPORTS.filter(r => r.pinned)
    : REPORTS.filter(r => !r.pinned);
  if (!q) return pool;
  return pool.filter(r => r.title.toLowerCase().includes(q) || r.filename.toLowerCase().includes(q));
}

function scopeTag(label) { const p=label.split('—'); return p.length>1?p[0].trim():''; }
function scopeTitle(label) { const p=label.split('—'); return p.length>1?p.slice(1).join('—').trim():label; }

function cardHTML(r) {
  const sb = r.scope_label ? `<span class="scopetag">${scopeTag(r.scope_label)||r.scope_label}</span>` : '';
  return `<a class="card" href="${r.filename}" target="_blank" rel="noopener">
    <div class="ct"><div class="ctitle">${r.title}</div>
      <span class="bdg" style="background:${r.area_bg};color:${r.area_color}">${r.area_icon} ${r.area_num||r.area_label}</span></div>
    <div class="cf"><span class="cdate">${sb}${r.date_display||'—'}</span><span class="copn">${t('open')}</span></div>
  </a>`;
}

function pcardHTML(r) {
  return `<a class="pcard" href="${r.filename}" target="_blank" rel="noopener">
    <div class="pcard-icon">${r.area_icon}</div>
    <div><div class="pcard-title">${r.title}</div>
      <div class="pcard-area">${r.area_num? t('area')+' '+r.area_num+' · ':''}${r.area_label}${r.scope_label?' · '+scopeTag(r.scope_label):''}</div>
    </div></a>`;
}

function sectionHTML(tag, title, cards) {
  return `<section class="sec">
    <div class="sec-hdr">${tag?`<span class="sec-num">${tag}</span>`:''}
      <span class="sec-title">${title}</span><span class="sec-cnt">${cards.length}</span></div>
    <div class="grid">${cards.map(cardHTML).join('')}</div></section>`;
}

function renderMain() {
  const main = document.getElementById('main');
  if (activeArea === 'skills') { renderSkills(main); return; }
  const list = getFiltered();
  document.getElementById('vis-count').textContent = list.length;
  if (!list.length) {
    main.innerHTML = `<div class="empty"><div class="ei">${activeArea==='all'?'📌':'🔍'}</div><p>${activeArea==='all'?t('emptyPinned'):t('emptyReports')}</p></div>`;
    return;
  }
  if (activeArea === 'all' && !query) {
    main.innerHTML = `<section class="sec">
      <div class="sec-hdr"><span class="sec-num">📌 MASTER</span>
        <span class="sec-title">${t('secPinned')}</span><span class="sec-cnt">${list.length}</span></div>
      <div class="pins-row">${list.map(pcardHTML).join('')}</div></section>`;
    return;
  }
  main.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
}

function skillCardHTML(s) {
  const desc = (lang === 'en' && s.description_en) ? s.description_en : s.description;
  return `<div class="scard">
    <div class="scard-top"><div class="scard-icon">${s.icon||'🧩'}</div>
      <div><div class="scard-title">${s.title}</div>
        <div class="scard-meta">${t('area')} ${s.area} · ${s.area_label} · v${s.version} · ${s.updated}</div></div></div>
    <div class="scard-desc">${desc||''}</div>
    <div class="scard-foot"><span class="scard-size">${s.size_kb?s.size_kb+' KB':''}</span>
      <a class="dl" href="${s.zip}" download>${t('download')}</a></div>
  </div>`;
}

function renderSkills(main) {
  const q = query.toLowerCase();
  const list = q ? SKILLS.filter(s => (s.title+' '+s.description+' '+(s.description_en||'')+' '+s.area_label).toLowerCase().includes(q)) : SKILLS;
  document.getElementById('vis-count').textContent = list.length;
  if (!list.length) {
    main.innerHTML = `<div class="empty"><div class="ei">🧩</div><p>${t('emptySkills')}</p></div>`;
    return;
  }
  main.innerHTML = `<section class="sec">
    <div class="sec-hdr"><span class="sec-num">🧩 SKILLS</span>
      <span class="sec-title">${t('secSkills')}</span><span class="sec-cnt">${list.length}</span></div>
    <div class="grid">${list.map(skillCardHTML).join('')}</div></section>`;
}

function render() { renderTabs(); renderMain(); }

applyStaticText();
document.getElementById('q').addEventListener('input', e => { query=e.target.value.trim(); render(); });
document.querySelectorAll('.langbtn').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('hubLang', lang); } catch (e) {}
  applyStaticText(); render();
}));
render();
</script>
</body>
</html>
