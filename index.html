  <style>
    :root {
      --brand-dark:       #0F1419;
      --brand-accent:     #EE5524;
      --brand-accent-hover: #D44A1F;
      --brand-white:      #FFFFFF;
      --neutral-900: #0F1419; --neutral-800: #1A1D24; --neutral-700: #2A2E37;
      --neutral-600: #4A4F5A; --neutral-500: #6B7280; --neutral-400: #9CA3AF;
      --neutral-300: #D1D5DB; --neutral-200: #E5E7EB; --neutral-100: #F3F4F6;
      --font-heading: 'Sora', system-ui, sans-serif;
      --font-body:    'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--brand-dark);
      color: var(--brand-white);
      min-height: 100vh;
    }

    /* ── Header ── */
    .hub-header {
      background: linear-gradient(135deg, #1A1D24 0%, #0F1419 60%, #1a0a04 100%);
      border-bottom: 1px solid #2A2E37;
      padding: 28px 40px 24px;
    }
    .hub-header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .hub-brand { display: flex; align-items: center; gap: 14px; }
    .hub-logo {
      width: 42px; height: 42px;
      background: var(--brand-accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; font-family: var(--font-heading);
      color: #fff; letter-spacing: -1px; flex-shrink: 0;
    }
    .hub-title-block h1 {
      font-family: var(--font-heading);
      font-size: 20px; font-weight: 700; color: #fff;
      line-height: 1.2;
    }
    .hub-title-block p {
      font-size: 12px; color: var(--neutral-400); margin-top: 2px;
    }
    .hub-stats {
      display: flex; gap: 24px; align-items: center;
    }
    .hub-stat {
      text-align: right;
    }
    .hub-stat .num {
      font-family: var(--font-heading);
      font-size: 22px; font-weight: 700;
      color: var(--brand-accent);
    }
    .hub-stat .lbl {
      font-size: 11px; color: var(--neutral-400); text-transform: uppercase; letter-spacing: .5px;
    }
    .hub-updated {
      font-size: 11px; color: var(--neutral-500);
      text-align: right;
    }

    /* ── Controls bar ── */
    .controls-bar {
      background: #13161C;
      border-bottom: 1px solid #2A2E37;
      padding: 16px 40px;
      position: sticky; top: 0; z-index: 100;
    }
    .controls-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    }
    .search-box {
      position: relative; flex: 1; min-width: 220px; max-width: 380px;
    }
    .search-box input {
      width: 100%;
      background: var(--neutral-800);
      border: 1px solid var(--neutral-700);
      border-radius: 8px;
      padding: 9px 14px 9px 38px;
      font-family: var(--font-body);
      font-size: 14px; color: var(--brand-white);
      outline: none;
      transition: border-color .2s;
    }
    .search-box input::placeholder { color: var(--neutral-500); }
    .search-box input:focus { border-color: var(--brand-accent); }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--neutral-500); font-size: 15px; pointer-events: none;
    }

    /* Category tabs */
    .cat-tabs {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .cat-tab {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--neutral-700);
      background: transparent;
      color: var(--neutral-400);
      font-family: var(--font-body);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .cat-tab:hover { border-color: var(--neutral-500); color: var(--brand-white); }
    .cat-tab.active {
      background: var(--brand-accent);
      border-color: var(--brand-accent);
      color: #fff;
    }

    /* ── Main ── */
    .main { max-width: 1200px; margin: 0 auto; padding: 32px 40px 60px; }

    /* Category section */
    .cat-section { margin-bottom: 40px; }
    .cat-section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--neutral-700);
    }
    .cat-section-icon { font-size: 18px; }
    .cat-section-title {
      font-family: var(--font-heading);
      font-size: 15px; font-weight: 600; color: var(--brand-white);
    }
    .cat-section-count {
      font-size: 12px; color: var(--neutral-500);
      background: var(--neutral-800);
      padding: 2px 8px; border-radius: 10px;
    }

    /* Cards grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--neutral-800);
      border: 1px solid var(--neutral-700);
      border-radius: 12px;
      padding: 18px 20px;
      cursor: pointer;
      transition: all .18s;
      display: flex; flex-direction: column; gap: 10px;
      text-decoration: none;
    }
    .card:hover {
      border-color: var(--brand-accent);
      background: #1F2330;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(238,85,36,.15);
    }
    .card-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .card-badge {
      font-size: 10px; font-weight: 600; letter-spacing: .4px;
      text-transform: uppercase;
      padding: 3px 8px; border-radius: 4px;
      white-space: nowrap; flex-shrink: 0;
    }
    .card-title {
      font-family: var(--font-heading);
      font-size: 14px; font-weight: 600; color: var(--brand-white);
      line-height: 1.4; flex: 1;
    }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-date {
      font-size: 12px; color: var(--neutral-500);
    }
    .card-open {
      font-size: 12px; color: var(--brand-accent); font-weight: 600;
      display: flex; align-items: center; gap: 4px;
      opacity: 0; transition: opacity .15s;
    }
    .card:hover .card-open { opacity: 1; }

    /* Empty / no-results */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--neutral-500);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    /* Pinned tag */
    .pin-icon { color: var(--brand-accent); font-size: 11px; }

    /* All-mode: flat list sorted by date */
    .flat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    @media (max-width: 768px) {
      .hub-header { padding: 20px; }
      .controls-bar { padding: 12px 20px; }
      .main { padding: 20px; }
      .hub-stats { display: none; }
    }
  </style>
</head>

const CATEGORIES = [{"id": "all", "label": "All Reports", "icon": "◉"}, {"id": "gameops", "label": "GameOps Analytics", "icon": "📊"}, {"id": "revenue", "label": "Revenue & BM", "icon": "💰"}, {"id": "community", "label": "VIP & Community", "icon": "👥"}, {"id": "social", "label": "Social Listening", "icon": "📡"}, {"id": "monthly", "label": "Monthly Reports", "icon": "📋"}, {"id": "roadmap", "label": "Roadmap", "icon": "🗺️"}, {"id": "tools", "label": "Tools & Docs", "icon": "🔧"}];

let activeCategory = 'all';
let searchQuery = '';

// ── Build category tabs ────────────────────────────────────────────────────
function renderTabs() {
  const container = document.getElementById('cat-tabs');
  // Count per category
  const counts = {};
  REPORTS.forEach(r => {
    counts[r.category_id] = (counts[r.category_id] || 0) + 1;
  });
  counts['all'] = REPORTS.length;

  container.innerHTML = CATEGORIES
    .filter(c => c.id === 'all' || (counts[c.id] || 0) > 0)
    .map(c => {
      const n = counts[c.id] || 0;
      const label = c.id === 'all' ? `${c.icon} ${c.label} (${n})` : `${c.icon} ${c.label}`;
      return `<button class="cat-tab${activeCategory === c.id ? ' active' : ''}"
                      data-cat="${c.id}">${label}</button>`;
    }).join('');

  container.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      render();
    });
  });
}

// ── Filter logic ──────────────────────────────────────────────────────────
function filterReports() {
  return REPORTS.filter(r => {
    const matchCat = activeCategory === 'all' || r.category_id === activeCategory;
    const q = searchQuery.toLowerCase();
    const matchSearch = !q || r.title.toLowerCase().includes(q) || r.filename.toLowerCase().includes(q) || r.category_label.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

// ── Render card HTML ──────────────────────────────────────────────────────
function renderCard(r) {
  const badge = `<span class="card-badge" style="background:${r.category_bg};color:${r.category_color}">${r.category_icon} ${r.category_label}</span>`;
  const dateLabel = r.date ? `${r.date_display}` : `<span class="pin-icon">📌</span> Pinned`;
  return `
    <a class="card" href="${r.filename}" target="_blank" rel="noopener">
      <div class="card-top">
        <div class="card-title">${r.title}</div>
        ${badge}
      </div>
      <div class="card-footer">
        <span class="card-date">${dateLabel}</span>
        <span class="card-open">Open →</span>
      </div>
    </a>`;
}

// ── Main render ───────────────────────────────────────────────────────────
function render() {
  renderTabs();
  const filtered = filterReports();
  const main = document.getElementById('main-content');
  document.getElementById('total-count').textContent = filtered.length;

  if (filtered.length === 0) {
    main.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><p>No reports match your search.</p></div>`;
    return;
  }

  if (activeCategory !== 'all' || searchQuery) {
    // Flat grid
    main.innerHTML = `<div class="flat-grid">${filtered.map(renderCard).join('')}</div>`;
    return;
  }

  // Grouped by category
  const groups = {};
  filtered.forEach(r => {
    if (!groups[r.category_id]) groups[r.category_id] = [];
    groups[r.category_id].push(r);
  });

  // Follow category display order
  const catOrder = CATEGORIES.filter(c => c.id !== 'all').map(c => c.id);
  let html = '';
  catOrder.forEach(catId => {
    const items = groups[catId];
    if (!items || items.length === 0) return;
    const cat = CATEGORIES.find(c => c.id === catId);
    html += `
      <section class="cat-section">
        <div class="cat-section-header">
          <span class="cat-section-icon">${cat.icon}</span>
          <span class="cat-section-title">${cat.label}</span>
          <span class="cat-section-count">${items.length}</span>
        </div>
        <div class="cards-grid">${items.map(renderCard).join('')}</div>
      </section>`;
  });

  main.innerHTML = html;
}

// ── Search ────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

// ── Init ──────────────────────────────────────────────────────────────────
render();
</script>
