<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L2M Report Hub — NCV Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--accent:#EE5524;--accent-h:#D44A1F;--white:#fff;
      --n900:#0F1419;--n800:#1A1D24;--n700:#2A2E37;
      --n600:#4A4F5A;--n500:#6B7280;--n400:#9CA3AF;
      --fh:'Sora',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--fb);background:var(--n900);color:var(--white);min-height:100vh}

    /* ── Header ── */
    .hdr{background:linear-gradient(135deg,#1A1D24 0%,#0F1419 60%,#1a0a04 100%);
          border-bottom:1px solid var(--n700);padding:26px 40px 22px}
    .hdr-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;
             justify-content:space-between;gap:20px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:14px}
    .logo{width:42px;height:42px;background:var(--accent);border-radius:10px;
           display:flex;align-items:center;justify-content:center;
           font:800 20px/1 var(--fh);color:#fff;letter-spacing:-1px;flex-shrink:0}
    .title h1{font:700 20px/1.2 var(--fh)}
    .title p{font-size:12px;color:var(--n400);margin-top:2px}
    .hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
    .stats{display:flex;gap:24px}
    .stat .n{font:700 22px var(--fh);color:var(--accent);text-align:right}
    .stat .l{font-size:11px;color:var(--n400);text-transform:uppercase;letter-spacing:.5px}
    .upd{font-size:11px;color:var(--n500)}

    /* ── Controls ── */
    .ctrl{background:#13161C;border-bottom:1px solid var(--n700);
           padding:12px 40px;position:sticky;top:0;z-index:100}
    .ctrl-in{max-width:1200px;margin:0 auto;display:flex;gap:12px;
              align-items:center;flex-wrap:wrap}
    .sw{position:relative;flex:1;min-width:200px;max-width:340px}
    .sw input{width:100%;background:var(--n800);border:1px solid var(--n700);
               border-radius:8px;padding:8px 12px 8px 34px;
               font:14px var(--fb);color:var(--white);outline:none;
               transition:border-color .2s}
    .sw input::placeholder{color:var(--n500)}
    .sw input:focus{border-color:var(--accent)}
    .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);
         color:var(--n500);font-size:14px;pointer-events:none}
    .tabs{display:flex;gap:5px;flex-wrap:wrap}
    .tab{padding:6px 13px;border-radius:20px;border:1px solid var(--n700);
          background:transparent;color:var(--n400);font:500 12px var(--fb);
          cursor:pointer;transition:all .15s;white-space:nowrap}
    .tab:hover{border-color:var(--n500);color:var(--white)}
    .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

    /* ── Pinned strip ── */
    .pins{background:linear-gradient(135deg,#1a0f07,#1A1D24);
           border-bottom:1px solid #3D2010;padding:18px 40px}
    .pins-in{max-width:1200px;margin:0 auto}
    .pins-hdr{display:flex;align-items:center;gap:6px;margin-bottom:12px}
    .pins-hdr span{font:600 12px var(--fh);color:var(--accent);
                    text-transform:uppercase;letter-spacing:.6px}
    .pins-row{display:flex;gap:10px;flex-wrap:wrap}
    .pcard{background:#231208;border:1px solid #5A2D0C;border-radius:10px;
            padding:12px 16px;cursor:pointer;text-decoration:none;
            display:flex;align-items:center;gap:10px;transition:all .18s;min-width:180px}
    .pcard:hover{border-color:var(--accent);background:#2D1A0A;
                  box-shadow:0 3px 14px rgba(238,85,36,.2)}
    .pcard-icon{font-size:20px;flex-shrink:0}
    .pcard-title{font:600 13px/1.3 var(--fh);color:#fff}
    .pcard-area{font-size:11px;color:var(--n400);margin-top:2px}

    /* ── Main ── */
    .main{max-width:1200px;margin:0 auto;padding:26px 40px 60px}
    .sec{margin-bottom:34px}
    .sec-hdr{display:flex;align-items:center;gap:9px;margin-bottom:12px;
              padding-bottom:9px;border-bottom:1px solid var(--n700)}
    .sec-num{font:700 11px var(--fh);color:var(--accent);letter-spacing:.5px;
              background:#2D1508;padding:2px 7px;border-radius:4px;flex-shrink:0}
    .sec-title{font:600 14px var(--fh)}
    .sec-cnt{font-size:12px;color:var(--n500);background:var(--n800);
              padding:2px 8px;border-radius:10px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
    .card{background:var(--n800);border:1px solid var(--n700);border-radius:10px;
           padding:14px 16px;cursor:pointer;transition:all .18s;
           display:flex;flex-direction:column;gap:8px;text-decoration:none}
    .card:hover{border-color:var(--accent);background:#1F2330;
                 transform:translateY(-1px);box-shadow:0 3px 16px rgba(238,85,36,.1)}
    .ct{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .ctitle{font:600 13px/1.4 var(--fh);flex:1;color:#fff}
    .bdg{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
          padding:2px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0}
    .cf{display:flex;align-items:center;justify-content:space-between}
    .cdate{font-size:11px;color:var(--n500)}
    .copn{font-size:11px;color:var(--accent);font-weight:600;opacity:0;transition:opacity .15s}
    .card:hover .copn{opacity:1}
    .empty{text-align:center;padding:60px 20px;color:var(--n500)}
    .empty .ei{font-size:44px;margin-bottom:10px}

    @media(max-width:768px){
      .hdr,.ctrl,.pins,.main{padding-left:20px;padding-right:20px}
      .stats{display:none}
    }
  </style>
</head>

const AREAS   = [{"id": "all", "label": "All Reports", "icon": "◉", "num": ""}, {"id": "area10", "label": "GameOps Analytics", "icon": "📊", "num": "10"}, {"id": "area08", "label": "Content Release Analytics", "icon": "📦", "num": "08"}, {"id": "area04", "label": "Social Listening", "icon": "📡", "num": "04"}, {"id": "area13", "label": "PUM Report", "icon": "📋", "num": "13"}, {"id": "area03", "label": "Glossary & Termbase", "icon": "📖", "num": "03"}, {"id": "other", "label": "Other", "icon": "📁", "num": ""}];

let activeArea = 'all', query = '';

function renderTabs() {
  const counts = {};
  REPORTS.forEach(r => { counts['all'] = (counts['all']||0)+1; counts[r.area_id] = (counts[r.area_id]||0)+1; });
  document.getElementById('tabs').innerHTML = AREAS
    .filter(a => a.id==='all' || counts[a.id])
    .map(a => {
      const n   = counts[a.id]||0;
      const lbl = a.id==='all' ? `${a.icon} All (${n})` : `${a.icon} ${a.num ? a.num+' · ':''}${a.label}`;
      return `<button class="tab${activeArea===a.id?' active':''}" data-id="${a.id}">${lbl}</button>`;
    }).join('');
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click',()=>{activeArea=b.dataset.id;render();}));
}

function getFiltered() {
  const q = query.toLowerCase();
  return REPORTS.filter(r => {
    const mA = activeArea==='all' || r.area_id===activeArea;
    const mQ = !q || r.title.toLowerCase().includes(q) || r.filename.toLowerCase().includes(q);
    return mA && mQ;
  });
}

function cardHTML(r) {
  return `<a class="card" href="${r.filename}" target="_blank" rel="noopener">
    <div class="ct">
      <div class="ctitle">${r.title}</div>
      <span class="bdg" style="background:${r.area_bg};color:${r.area_color}">${r.area_icon} ${r.area_num||r.area_label}</span>
    </div>
    <div class="cf">
      <span class="cdate">${r.date_display||'—'}</span>
      <span class="copn">Open →</span>
    </div>
  </a>`;
}

function renderPins() {
  const ps  = document.getElementById('pins-section');
  const row = document.getElementById('pins-row');
  const pinned = REPORTS.filter(r => r.pinned);
  const show   = activeArea==='all' && !query && pinned.length;
  ps.style.display = show ? '' : 'none';
  if (!show) return;
  row.innerHTML = pinned.map(r => `
    <a class="pcard" href="${r.filename}" target="_blank" rel="noopener">
      <div class="pcard-icon">${r.area_icon}</div>
      <div>
        <div class="pcard-title">${r.title}</div>
        <div class="pcard-area">${r.area_num?'Area '+r.area_num+' · ':''}${r.area_label}</div>
      </div>
    </a>`).join('');
}

function renderMain() {
  const list = getFiltered();
  document.getElementById('vis-count').textContent = list.length;
  const main = document.getElementById('main');

  if (!list.length) {
    main.innerHTML = `<div class="empty"><div class="ei">🔍</div><p>No reports found.</p></div>`;
    return;
  }

  if (activeArea !== 'all' || query) {
    main.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
    return;
  }

  // Grouped view — exclude pinned from body (already shown above)
  const groups = {};
  list.filter(r => !r.pinned).forEach(r => { (groups[r.area_id]=groups[r.area_id]||[]).push(r); });
  const order = AREAS.filter(a => a.id!=='all').map(a => a.id);
  main.innerHTML = order.filter(id => groups[id]?.length).map(id => {
    const a = AREAS.find(x => x.id===id);
    return `<section class="sec">
      <div class="sec-hdr">
        ${a.num?`<span class="sec-num">Area ${a.num}</span>`:''}
        <span style="font-size:15px">${a.icon}</span>
        <span class="sec-title">${a.label}</span>
        <span class="sec-cnt">${groups[id].length}</span>
      </div>
      <div class="grid">${groups[id].map(cardHTML).join('')}</div>
    </section>`;
  }).join('');
}

function render() { renderTabs(); renderPins(); renderMain(); }

document.getElementById('q').addEventListener('input', e => { query=e.target.value.trim(); render(); });
render();
</script>
