<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameOps Reading v2.0 — Event Impact Engine</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#0F1419; --ink2:#3a4650; --mut:#7a8794; --line:#e7ebee; --bg:#f5f7f8; --card:#ffffff;
  --orange:#EE5524; --orange-d:#c73f14;
  --green:#2e9e5b; --amber:#e0a417; --red:#d64545;
  --gA:#8bd3c7; --gB:#6fb1d6; --gC:#7f9ce0; --gD:#b088e0; --gE:#e08bc0; --gF:#e0a017; --gG:#EE5524;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,.head{font-family:'Sora','Inter',sans-serif;letter-spacing:-.01em}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
header.top{background:var(--ink);color:#fff;padding:20px 0 16px}
header.top .wrap{padding-top:0;padding-bottom:0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--orange)}
.brand h1{font-size:20px;margin:0;font-weight:700}
.brand .ver{font-size:11px;color:#b7c0c8;border:1px solid #33404b;border-radius:20px;padding:2px 9px}
.sub{color:#aeb8c0;font-size:12px;margin-top:6px}
.sub b{color:#fff}
/* tabs */
nav.tabs{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(15,20,25,.05)}
nav.tabs .wrap{display:flex;gap:2px;flex-wrap:wrap;padding-top:0;padding-bottom:0}
.tab-btn{appearance:none;border:0;background:transparent;padding:13px 15px;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;font-family:'Sora',sans-serif}
.tab-btn:hover{color:var(--ink)}
.tab-btn.on{color:var(--orange-d);border-bottom-color:var(--orange)}
section.tab{display:none;padding-top:22px}
section.tab.on{display:block}
/* cards + kpi */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:4px 0 20px}
.kpi .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .lab{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:22px;font-weight:700;margin-top:3px;font-family:'Sora',sans-serif}
.kpi .val small{font-size:12px;color:var(--mut);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.card h2{font-size:16px;margin:0 0 4px}
.card .lede{color:var(--ink2);font-size:13px;margin:0 0 14px}
.note{background:#fff7ed;border:1px solid #f6d9c4;border-left:3px solid var(--orange);border-radius:8px;padding:11px 14px;font-size:12.5px;color:#7a4a2e;margin:12px 0}
.note b{color:var(--orange-d)}
.muted{color:var(--mut)}
/* confidence dot */
.cd{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:5px}
.cd.g{background:var(--green)} .cd.y{background:var(--amber)} .cd.r{background:var(--red)}
.badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
.badge.g{background:#e6f4ec;color:#1d7a44} .badge.y{background:#fbf1d7;color:#8a6410} .badge.r{background:#fbe6e6;color:#a52a2a}
.badge.k{background:#eef1f4;color:#4a5763}
.badge.use{background:#e6f4ec;color:#1d7a44} .badge.nouse{background:#eef1f4;color:#7a8794}
/* controls */
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:2px 0 14px}
.ctrl select,.ctrl input[type=text]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.chip{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer;user-select:none;background:#fff;display:inline-flex;align-items:center;gap:5px}
.chip.off{opacity:.4}
.chip .sw{width:9px;height:9px;border-radius:50%}
/* table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);cursor:pointer;position:static;background:#fff}
th.num,td.num{text-align:right;font-family:'JetBrains Mono',monospace}
tr.imp{cursor:pointer}
tr.imp:hover{background:#f0fbff}
tr.det>td{background:#fbfcfd;white-space:normal;padding:0}
.detbox{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.detbox h4{margin:0 0 8px;font-size:12.5px;font-family:'Sora',sans-serif}
.pos{color:var(--green)} .neg{color:var(--red)}
/* tier bars */
.tierbar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.tierbar .nm{width:96px;color:var(--ink2);flex-shrink:0}
.tierbar .track{flex:1;background:#eef1f4;border-radius:5px;height:12px;overflow:hidden;min-width:60px}
.tierbar .fill{height:100%;border-radius:5px}
.tierbar .pc{width:52px;text-align:right;font-family:'JetBrains Mono',monospace;flex-shrink:0}
/* library cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.lc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.lc .pn{font-family:'Sora',sans-serif;font-weight:700;font-size:14px}
.lc .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0 8px}
.lc .m .l{font-size:10.5px;color:var(--mut);text-transform:uppercase}
.lc .m .v{font-size:17px;font-weight:700;font-family:'Sora',sans-serif}
.lc .mixbar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:6px 0}
.lc .mixbar span{display:block}
.lc .foot{font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.kicker{font-family:'Sora',sans-serif;font-size:12px;font-weight:700;color:var(--orange-d);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 10px}
.legend{font-size:12px;color:var(--ink2);display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.chartbox{position:relative;height:380px}
footer{color:var(--mut);font-size:11.5px;text-align:center;margin-top:30px;padding-top:16px;border-top:1px solid var(--line)}
a{color:var(--orange-d)}
@media(max-width:860px){ .kpi{grid-template-columns:repeat(2,1fr)} .grid{grid-template-columns:1fr} .detbox{grid-template-columns:1fr} }

<script>
const D = window.__DATA__;
const CONF = {"🟢":"g","🟡":"y","🔴":"r"};
const TYPE_LABEL = {"tính_năng":"Tính năng / Update","event":"Sự kiện","khuyến_mãi":"Khuyến mãi","gói_bán":"Gói bán"};
const TIER_COLOR = {A:"var(--gA)",B:"var(--gB)",C:"var(--gC)",D:"var(--gD)",E:"var(--gE)",F:"var(--gF)",G:"var(--gG)"};
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fUsd(v){if(v==null)return "—";const a=Math.abs(v);let s=(v<0?"-$":"$");if(a>=1e6)return s+(a/1e6).toFixed(2)+"M";if(a>=1e3)return s+(a/1e3).toFixed(1)+"K";return s+Math.round(a);}
function fPct(v,d){if(v==null)return "—";return (v>=0?"+":"")+(v*100).toFixed(d==null?0:d)+"%";}
function fMult(v){if(v==null)return "—";return "×"+v.toFixed(2);}
function fVndB(v){if(v==null)return "—";return (v/1e9).toFixed(2)+"B";}
function confDot(c){const k=CONF[c]||"r";return '<span class="cd '+k+'"></span>';}
function confBadge(c){const k=CONF[c]||"r";const t={g:"Đơn lẻ",y:"Chồng 1 phần",r:"Cùng ngày (gộp)"}[k];return '<span class="badge '+k+'">'+c+' '+t+'</span>';}

/* ---------------- tabs ---------------- */
const TABS=["Tổng quan","Dòng thời gian","Tác động chi tiết","Thư viện Insight","Học & Dự báo"];
let cur=0;
function buildTabs(){
  document.getElementById("tabbar").innerHTML=TABS.map((t,i)=>'<button class="tab-btn'+(i==0?" on":"")+'" data-i="'+i+'">'+t+'</button>').join("");
  document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){
  cur=i;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("on",+b.dataset.i==i));
  document.querySelectorAll("section.tab").forEach((s,j)=>s.classList.toggle("on",j==i));
  if(i==1&&!window._tlDrawn){drawTimeline();window._tlDrawn=true;}
}

/* ---------------- header ---------------- */
function renderHeader(){
  document.getElementById("hv").textContent=D.version;
  const r=D.meta.ranges||{};
  document.getElementById("hs").innerHTML=
    'Cập nhật <b>'+esc(D.built)+'</b> · Data tới <b>'+esc(D.snapshot)+'</b> · '+
    'Đo <b>'+D.meta.n_measured+'</b> nội dung · <b>'+D.meta.n_patterns+'</b> nhóm insight · FX <b>'+Number(D.fx).toLocaleString()+'</b> VND/$';
  document.getElementById("ft").innerHTML=
    'GameOps Reading '+esc(D.version)+' — Event Impact Engine · nguồn: impact_library.json (engine P2) + content_ledger.json ('+D.meta.n_ledger+' mục) + lifecycle daily.<br>'+
    'NCV Games / L2M SEA · số chính = độ nảy spike 3 ngày (launch_mult); window/before-after = tham khảo.';
}

/* ---------------- TAB 0 : overview ---------------- */
function renderOverview(){
  const cd=D.meta.confdist||{}, r=D.meta.ranges||{};
  const usable=D.library.filter(l=>l.usable).length;
  let h='';
  h+='<div class="kpi">'+
     box("Nội dung đã đo", D.meta.n_measured, "trên "+D.meta.n_ledger+" mục lịch")+
     box("Nhóm insight", D.meta.n_patterns, usable+" nhóm dùng được cho forecast")+
     box("Độ tin cậy", '<span class="pos">'+(cd["🟢"]||0)+'</span> / <span style="color:var(--amber)">'+(cd["🟡"]||0)+'</span> / <span class="neg">'+(cd["🔴"]||0)+'</span>', "🟢 đơn lẻ · 🟡 chồng 1 phần · 🔴 gộp")+
     box("Tỷ giá quy đổi", Number(D.fx).toLocaleString(), "VND / USD (frozen)")+
     '</div>';

  h+='<div class="card"><h2>Báo cáo này đọc gì?</h2>'+
     '<p class="lede">Mỗi lần game ra <b>update / sự kiện / khuyến mãi / gói bán</b>, engine đo xem doanh thu &amp; người chơi <b>nảy lên bao nhiêu</b> so với nhịp bình thường, rồi gom thành bài học theo từng loại nội dung để phục vụ dự báo.</p>'+
     '<div class="legend">'+
       '<span><b>Độ nảy (×)</b> = doanh thu 3 ngày đầu ÷ trung bình 7 ngày trước. ×1.9 nghĩa là nảy gấp ~1.9 lần.</span>'+
     '</div>'+
     '<div class="note"><b>Đọc số cho đúng:</b> '+esc((D.meta.caveats||[])[0]||"")+'</div>'+
     '</div>';

  // data coverage
  h+='<div class="card"><h2>Phạm vi dữ liệu</h2><div class="tbl-wrap"><table><tbody>'+
     row2("Doanh thu / PU (tổng)", esc(r.revenue_pu_total||"—"))+
     row2("VIP theo tier (A→G)", esc(r.vip_tier||"—"))+
     row2("Tiêu Kim Cương (theo category)", esc(r.diamond||"—"))+
     row2("Quyết định đo Kim Cương", esc(D.meta.gate||"—"))+
     '</tbody></table></div>'+
     '<div class="note">'+((D.meta.caveats||[]).slice(1).map(c=>"• "+esc(c)).join("<br>"))+'</div>'+
     '</div>';

  // top patterns quick
  const top=[...D.library].filter(l=>l.usable&&l.lm_med!=null).sort((a,b)=>b.lm_med-a.lm_med).slice(0,6);
  h+='<div class="card"><h2>Loại nội dung nảy mạnh nhất (theo độ nảy điển hình)</h2><div class="tbl-wrap"><table>'+
     '<thead><tr><th>Loại nội dung</th><th class="num">Độ nảy điển hình</th><th class="num">Uplift $ (median)</th><th class="num">Số lần đo</th><th>Tier mạnh nhất</th></tr></thead><tbody>'+
     top.map(l=>'<tr><td>'+esc(l.pattern)+' <span class="badge k">'+esc(l.kind)+'</span></td>'+
       '<td class="num"><b>'+fMult(l.lm_med)+'</b></td>'+
       '<td class="num">'+fUsd(l.up_med)+'</td>'+
       '<td class="num">'+l.nclean+'</td>'+
       '<td>'+esc(l.tier||"—")+'</td></tr>').join("")+
     '</tbody></table></div><p class="muted" style="font-size:11.5px;margin:8px 0 0">Xem đầy đủ ở tab <b>Thư viện Insight</b>.</p></div>';

  document.getElementById("t0").innerHTML=h;
}
function box(l,v,s){return '<div class="box"><div class="lab">'+l+'</div><div class="val">'+v+(s?' <small>'+esc(s)+'</small>':'')+'</div></div>';}
function row2(a,b){return '<tr><td>'+a+'</td><td class="num">'+b+'</td></tr>';}

/* ---------------- TAB 1 : timeline ---------------- */
let chart=null, tlMetric="rev", tlTypes={"tính_năng":1,"event":1,"khuyến_mãi":0,"gói_bán":0}, tlConf={"🟢":1,"🟡":1,"🔴":1};
function renderTimelineShell(){
  let h='<div class="card"><h2>Dòng thời gian — nội dung chồng lên đường doanh thu</h2>'+
    '<p class="lede">Mỗi chấm = 1 nội dung ra mắt, đặt đúng ngày trên đường chỉ số. Màu = độ tin cậy, to/nhỏ = độ nảy. Nhìn để thấy nội dung nào trùng với sóng lên/xuống.</p>';
  h+='<div class="ctrl"><label>Chỉ số: <select id="tlMetric"><option value="rev">Doanh thu (tỷ VND)</option><option value="pu">Người trả tiền (PU)</option><option value="dau">DAU (nghìn)</option></select></label>';
  h+='<span style="margin-left:6px">Loại:</span>'+Object.keys(tlTypes).map(t=>'<span class="chip type'+(tlTypes[t]?"":" off")+'" data-t="'+t+'">'+esc(TYPE_LABEL[t])+'</span>').join("");
  h+='</div><div class="ctrl">Tin cậy: '+Object.keys(tlConf).map(c=>'<span class="chip conf'+(tlConf[c]?"":" off")+'" data-c="'+c+'"><span class="sw" style="background:'+({"🟢":"var(--green)","🟡":"var(--amber)","🔴":"var(--red)"}[c])+'"></span>'+c+'</span>').join("")+'</div>';
  h+='<div class="chartbox"><canvas id="tlChart"></canvas></div>';
  h+='<div class="legend"><span>🟢 đơn lẻ</span><span>🟡 chồng một phần</span><span>🔴 cùng ngày (đo gộp)</span><span class="muted">Chấm to = nảy mạnh</span></div>';
  h+='</div><div class="card"><h2>Nội dung nổi bật (đang hiển thị)</h2><div id="tlList" class="tbl-wrap"></div></div>';
  document.getElementById("t1").innerHTML=h;
  document.getElementById("tlMetric").onchange=e=>{tlMetric=e.target.value;drawTimeline();};
  document.querySelectorAll("#t1 .chip.type").forEach(c=>c.onclick=()=>{tlTypes[c.dataset.t]^=1;c.classList.toggle("off");drawTimeline();});
  document.querySelectorAll("#t1 .chip.conf").forEach(c=>c.onclick=()=>{tlConf[c.dataset.c]^=1;c.classList.toggle("off");drawTimeline();});
}
function metricArr(){return tlMetric=="rev"?D.series.rev:(tlMetric=="pu"?D.series.pu:D.series.dau);}
function metricLabel(){return tlMetric=="rev"?"Doanh thu (tỷ VND)":(tlMetric=="pu"?"Người trả tiền":"DAU (nghìn)");}
function activeMarkers(){
  const di=D.date_idx, arr=metricArr();
  return D.impacts.filter(x=>x.s&&tlTypes[x.type]&&tlConf[x.conf]&&(x.s in di)&&arr[di[x.s]]!=null)
    .map(x=>({x:di[x.s],y:arr[di[x.s]],m:x}));
}
function drawTimeline(){
  const arr=metricArr(), dates=D.series.dates;
  const line=arr.map((v,i)=>({x:i,y:v}));
  const mk=activeMarkers();
  const byc={g:[],y:[],r:[]};
  mk.forEach(p=>{byc[CONF[p.m.conf]||"r"].push({x:p.x,y:p.y,m:p.m});});
  const rad=p=>{const m=(p&&p.raw)?p.raw.m:null; const lm=m?m.lm:null; if(lm==null)return 4; return Math.max(3,Math.min(11,3+Math.abs(lm-1)*6));};
  const ds=[{type:"line",label:metricLabel(),data:line,borderColor:"#0F1419",borderWidth:1.4,pointRadius:0,tension:.25,order:5}];
  const cc={g:"#2e9e5b",y:"#e0a417",r:"#d64545"};
  ["g","y","r"].forEach(k=>{ds.push({type:"scatter",label:k,data:byc[k],backgroundColor:cc[k]+"cc",borderColor:cc[k],pointRadius:rad,pointHoverRadius:ctx=>rad(ctx)+2,order:1});});
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById("tlChart"),{data:{datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,animation:false,
    scales:{x:{type:"linear",min:0,max:dates.length-1,ticks:{callback:v=>{const d=dates[Math.round(v)];return d?d.slice(0,7):"";},maxTicksLimit:10,autoSkip:true},grid:{color:"#eef1f4"}},
            y:{beginAtZero:true,grid:{color:"#eef1f4"}}},
    plugins:{legend:{display:false},tooltip:{callbacks:{
      title:items=>{const it=items[0];if(it.dataset.type=="line")return dates[Math.round(it.parsed.x)];const m=it.raw.m;return m.name;},
      label:it=>{if(it.dataset.type=="line")return metricLabel()+": "+(it.parsed.y==null?"—":it.parsed.y.toLocaleString());
        const m=it.raw.m;return [(TYPE_LABEL[m.type]||m.type)+" · "+m.conf,"Ngày: "+m.s,"Độ nảy: "+fMult(m.lm)+"  ·  Uplift: "+fUsd(m.up)];}
    }}}
  }});
  // list
  const rows=[...mk].sort((a,b)=>(b.m.lm||0)-(a.m.lm||0)).slice(0,25);
  document.getElementById("tlList").innerHTML='<table><thead><tr><th>Ngày</th><th>Nội dung</th><th>Loại</th><th>Tin cậy</th><th class="num">Độ nảy</th><th class="num">Uplift $</th></tr></thead><tbody>'+
    rows.map(p=>{const m=p.m;return '<tr><td class="mono">'+esc(m.s)+'</td><td>'+esc(m.name)+'</td><td>'+esc(TYPE_LABEL[m.type]||m.type)+'</td><td>'+confDot(m.conf)+m.conf+'</td><td class="num"><b>'+fMult(m.lm)+'</b></td><td class="num">'+fUsd(m.up)+'</td></tr>';}).join("")+
    '</tbody></table>'+(rows.length==0?'<p class="muted">Không có nội dung khớp bộ lọc.</p>':'');
}

/* ---------------- TAB 2 : impact table ---------------- */
let iFilterType="", iFilterConf="", iSearch="", iSort="lm", iDir=-1, iOpen={};
function renderImpactShell(){
  let h='<div class="card"><h2>Tác động chi tiết từng nội dung</h2>'+
    '<p class="lede">'+D.meta.n_measured+' nội dung đã đo. Bấm vào 1 dòng để xem baseline, VIP theo tier và tiêu Kim Cương. Số chính là <b>độ nảy 3 ngày đầu</b>.</p>';
  h+='<div class="ctrl">'+
     '<input type="text" id="iSearch" placeholder="Tìm tên nội dung…" style="min-width:200px">'+
     '<select id="iType"><option value="">Mọi loại</option>'+Object.keys(TYPE_LABEL).map(t=>'<option value="'+t+'">'+esc(TYPE_LABEL[t])+'</option>').join("")+'</select>'+
     '<select id="iConf"><option value="">Mọi độ tin cậy</option><option value="🟢">🟢 đơn lẻ</option><option value="🟡">🟡 chồng 1 phần</option><option value="🔴">🔴 gộp</option></select>'+
     '<span id="iCount" class="muted"></span></div>';
  h+='<div class="tbl-wrap"><table id="iTbl"><thead><tr>'+
     th("name","Nội dung")+th("type","Loại")+th("s","Ngày")+th("conf","Tin cậy")+
     th("lm","Độ nảy DT",1)+th("up","Uplift $",1)+th("pl","Độ nảy PU",1)+th("dia","KC spike",1)+th("tier","Tier mạnh")+
     '</tr></thead><tbody id="iBody"></tbody></table></div></div>';
  document.getElementById("t2").innerHTML=h;
  document.getElementById("iSearch").oninput=e=>{iSearch=e.target.value.toLowerCase();drawImpacts();};
  document.getElementById("iType").onchange=e=>{iFilterType=e.target.value;drawImpacts();};
  document.getElementById("iConf").onchange=e=>{iFilterConf=e.target.value;drawImpacts();};
  document.querySelectorAll("#iTbl th[data-k]").forEach(t=>t.onclick=()=>{const k=t.dataset.k;if(iSort==k)iDir*=-1;else{iSort=k;iDir=-1;}drawImpacts();});
  drawImpacts();
}
function th(k,l,n){return '<th data-k="'+k+'" class="'+(n?"num":"")+'">'+l+'</th>';}
function impVal(x,k){if(k=="dia")return x.dia?x.dia.p:null;if(k=="tier")return x.vt?(x.vt.sa||""):"";return x[k];}
function drawImpacts(){
  let rows=D.impacts.filter(x=>
    (!iFilterType||x.type==iFilterType)&&(!iFilterConf||x.conf==iFilterConf)&&
    (!iSearch||(x.name||"").toLowerCase().includes(iSearch)));
  rows.sort((a,b)=>{let va=impVal(a,iSort),vb=impVal(b,iSort);
    if(typeof va=="string"||typeof vb=="string"){va=(va||"").toString();vb=(vb||"").toString();return iDir*va.localeCompare(vb);}
    va=(va==null?-1e18:va);vb=(vb==null?-1e18:vb);return iDir*(va-vb);});
  document.getElementById("iCount").textContent=rows.length+" nội dung";
  const b=document.getElementById("iBody");
  b.innerHTML=rows.map(x=>{
    const tr='<tr class="imp" data-id="'+esc(x.id)+'">'+
      '<td>'+esc(x.name||"")+(x.edge?' <span class="badge k" title="cửa sổ chạm cuối lifecycle, uplift có thể thấp giả">rìa</span>':'')+'</td>'+
      '<td>'+esc(TYPE_LABEL[x.type]||x.type)+'</td>'+
      '<td class="mono">'+esc(x.s||"")+'</td>'+
      '<td>'+confDot(x.conf)+(x.co>0?'<span class="muted" title="số nội dung lớn khác ra mắt trong ±3 ngày"> +'+x.co+'</span>':'')+'</td>'+
      '<td class="num"><b>'+fMult(x.lm)+'</b></td>'+
      '<td class="num '+cls(x.up)+'">'+fUsd(x.up)+'</td>'+
      '<td class="num">'+fMult(x.pl)+'</td>'+
      '<td class="num '+cls(x.dia?x.dia.p:null)+'">'+(x.dia?fPct(x.dia.p):"—")+'</td>'+
      '<td>'+esc(x.vt?(x.vt.sa||"—"):"—")+'</td></tr>';
    const det=iOpen[x.id]?detRow(x):"";
    return tr+det;
  }).join("");
  document.querySelectorAll("#iBody tr.imp").forEach(tr=>tr.onclick=()=>{const id=tr.dataset.id;iOpen[id]=!iOpen[id];drawImpacts();});
}
function cls(v){return v==null?"":(v>=0?"pos":"neg");}
function detRow(x){
  let left='<h4>Cách đo (baseline 14 ngày)</h4>';
  left+='<div class="tbl-wrap"><table><tbody>'+
    row2b("Độ nảy DT (3 ngày đầu)","<b>"+fMult(x.lm)+"</b> — "+fPct(x.upp)+" vs baseline")+
    row2b("Uplift doanh thu ($)",'<span class="'+cls(x.up)+'">'+fUsd(x.up)+"</span>")+
    row2b("Đỉnh trong cửa sổ",fMult(x.pk))+
    row2b("Độ nảy PU","<b>"+fMult(x.pl)+"</b> — "+fPct(x.plp))+
    row2b("Trước/sau (vs 7 ngày trước)",'<span class="'+cls(x.ba7)+'">'+fPct(x.ba7,1)+"</span>")+
    row2b("Cửa sổ tổng (tham khảo)","<span class='muted'>"+fPct(x.wup)+"</span>")+
    '</tbody></table></div>';
  left+='<p class="muted" style="font-size:11px;margin:8px 0 0">'+confBadge(x.conf)+(x.co>0?" · "+x.co+" nội dung lớn khác trong ±3 ngày":"")+'</p>';

  let right='';
  if(x.vt&&x.vt.tiers){
    right+='<h4>VIP theo tier — phần đóng góp doanh thu ('+esc(x.vt.cov||"")+')</h4>';
    const order=["A","B","C","D","E","F","G"];
    const maxsh=Math.max(...order.map(t=>(x.vt.tiers[t]&&x.vt.tiers[t].sh)||0),0.0001);
    right+=order.map(t=>{const v=x.vt.tiers[t];if(!v)return "";const sh=v.sh||0;
      return '<div class="tierbar"><span class="nm">'+esc(v.lbl||t)+'</span><span class="track"><span class="fill" style="width:'+(Math.max(0,sh)/maxsh*100).toFixed(0)+'%;background:'+TIER_COLOR[t]+'"></span></span><span class="pc">'+(sh?(sh*100).toFixed(1)+"%":"—")+'</span></div>';
    }).join("");
    if(x.vt.sa)right+='<p class="muted" style="font-size:11px;margin:6px 0 0">Đóng góp $ lớn nhất: <b>'+esc(x.vt.sa)+'</b> · nảy % mạnh nhất: <b>'+esc(x.vt.sp||"—")+'</b></p>';
  }else{
    right+='<h4>VIP theo tier</h4><p class="muted">Không có breakdown (nội dung trước 2026-01 hoặc thiếu data tier).</p>';
  }
  if(x.dia&&x.dia.cats&&x.dia.cats.length){
    right+='<h4 style="margin-top:12px">Tiêu Kim Cương — spike '+fPct(x.dia.p)+'</h4><div class="tbl-wrap"><table><tbody>'+
      x.dia.cats.map(c=>row2b(esc(c.c),fPct(c.upp)+' <span class="muted">('+(c.up==null?"—":Math.round(c.up).toLocaleString())+" KC)</span>")).join("")+'</tbody></table></div>';
  }
  return '<tr class="det"><td colspan="9"><div class="detbox"><div>'+left+'</div><div>'+right+'</div></div></td></tr>';
}
function row2b(a,b){return '<tr><td>'+a+'</td><td class="num">'+b+'</td></tr>';}

/* ---------------- TAB 3 : insight library ---------------- */
let libSort="nobs";
function renderLibraryShell(){
  let h='<div class="card"><h2>Thư viện Insight — bài học theo loại nội dung</h2>'+
    '<p class="lede">Gom '+D.meta.n_measured+' lần đo thành '+D.meta.n_patterns+' nhóm. Mỗi nhóm cho biết độ nảy điển hình + khoảng dao động + tier phản ứng mạnh nhất. Chỉ nhóm ≥3 lần đo sạch mới <span class="badge use">dùng cho forecast</span>.</p>'+
    '<div class="ctrl">Sắp xếp: <select id="libSort"><option value="nobs">Số lần đo</option><option value="lm_med">Độ nảy điển hình</option><option value="up_med">Uplift $ median</option></select></div></div>';
  h+='<div id="libGrids"></div>';
  document.getElementById("t3").innerHTML=h;
  document.getElementById("libSort").onchange=e=>{libSort=e.target.value;drawLibrary();};
  drawLibrary();
}
function drawLibrary(){
  const kinds=[["tính_năng","Update / Tính năng"],["event","Sự kiện"],["khuyến_mãi","Khuyến mãi"],["package","Gói bán"]];
  let h="";
  kinds.forEach(([k,lbl])=>{
    let items=D.library.filter(l=>l.kind==k);
    if(!items.length)return;
    items.sort((a,b)=>(b[libSort]||-1)-(a[libSort]||-1));
    h+='<div class="kicker">'+esc(lbl)+'</div><div class="grid">'+items.map(libCard).join("")+'</div>';
  });
  document.getElementById("libGrids").innerHTML=h;
}
function libCard(l){
  const mix=l.mix||{};
  const tot=(mix["🟢"]||0)+(mix["🟡"]||0)+(mix["🔴"]||0)||1;
  const seg=(n,c)=>'<span style="width:'+((n||0)/tot*100)+'%;background:'+c+'"></span>';
  const isPkg=l.kind=="package";
  return '<div class="lc"><div class="top"><div><div class="pn">'+esc(l.pattern)+'</div>'+
    '<div class="muted" style="font-size:11.5px">'+l.nobs+' lần đo · '+l.nclean+' sạch · '+l.ngreen+' 🟢</div></div>'+
    (l.usable?'<span class="badge use">forecast ✓</span>':'<span class="badge nouse">chưa đủ</span>')+'</div>'+
    '<div class="mixbar">'+seg(mix["🟢"],"#2e9e5b")+seg(mix["🟡"],"#e0a417")+seg(mix["🔴"],"#d64545")+'</div>'+
    '<div class="metrics">'+
      m("Độ nảy DT (median)",fMult(l.lm_med))+
      m(isPkg?"Doanh thu gói (median)":"Uplift $ (median)",isPkg?fUsd(l.dr_med):fUsd(l.up_med))+
      m("Độ nảy PU (median)",fMult(l.pu_med))+
      m("Tiêu KC spike (median)",l.dia_med==null?"—":fPct(l.dia_med))+
    '</div>'+
    '<div class="muted" style="font-size:11.5px">Khoảng độ nảy: '+fMult(l.lm_min)+' – '+fMult(l.lm_max)+' · Tier mạnh nhất: <b>'+esc(l.tier||"—")+'</b></div>'+
    (l.note?'<div class="foot">'+esc(l.note)+'</div>':'')+'</div>';
}
function m(l,v){return '<div class="m"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}

/* ---------------- TAB 4 : learning + forecast ---------------- */
function renderForecast(){
  const usable=D.library.filter(l=>l.usable).sort((a,b)=>(b.nclean||0)-(a.nclean||0));
  let h='<div class="card"><h2>Học &amp; Dự báo — cơ chế 2 giai đoạn</h2>'+
    '<p class="lede">Engine hoạt động theo 2 giai đoạn để tránh dự báo ẩu khi thư viện còn mỏng.</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Giai đoạn</th><th>Làm gì</th><th>Trạng thái</th></tr></thead><tbody>'+
    '<tr><td><b>GĐ1 — Kiểm chứng</b></td><td>Tích lũy thư viện insight, người vận hành đọc &amp; đối chiếu với thực tế</td><td><span class="badge g">Đang chạy</span></td></tr>'+
    '<tr><td><b>GĐ2 — Forecast tự học</b></td><td>Model đọc thư viện + lịch nội dung sắp tới → tự điều chỉnh dự phóng, đo sai/đúng để tối ưu</td><td><span class="badge nouse">Bật ở P4 (sau 2–4 tuần + anh kiểm chứng số)</span></td></tr>'+
    '</tbody></table></div>'+
    '<div class="note"><b>Vì sao chưa bật GĐ2:</b> thư viện cần đủ dày và số phải được kiểm chứng ngoài đời trước khi cho forecast tự dùng — đúng thiết kế 2 giai đoạn đã chốt.</div></div>';

  // lookup table
  h+='<div class="card"><h2>Bảng tra cứu forecast (GĐ1) — '+usable.length+' loại đã dùng được</h2>'+
    '<p class="lede">Khi định làm một loại nội dung, tra đây để biết kỳ vọng sơ bộ (dựa trên các lần đo sạch).</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Loại nội dung</th><th class="num">Độ nảy kỳ vọng</th><th class="num">Khoảng</th><th class="num">Uplift/DT gói (median)</th><th class="num">n</th><th>Tier mạnh</th></tr></thead><tbody>'+
    usable.map(l=>{const isPkg=l.kind=="package";return '<tr><td>'+esc(l.pattern)+' <span class="badge k">'+esc(l.kind)+'</span></td>'+
      '<td class="num"><b>'+fMult(l.lm_med)+'</b></td>'+
      '<td class="num muted">'+fMult(l.lm_min)+'–'+fMult(l.lm_max)+'</td>'+
      '<td class="num">'+(isPkg?fUsd(l.dr_med):fUsd(l.up_med))+'</td>'+
      '<td class="num">'+l.nclean+'</td><td>'+esc(l.tier||"—")+'</td></tr>';}).join("")+
    '</tbody></table></div></div>';

  // upcoming planned
  if(D.plan&&D.plan.length){
    h+='<div class="card"><h2>Nội dung sắp ra mắt — kỳ vọng sơ bộ</h2>'+
      '<p class="lede">Milestone tương lai trong lịch nội dung, ghép với loại gần nhất trong thư viện. Đây là <b>tham khảo</b> — số thật sẽ đo khi nội dung chạy.</p>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th>Nội dung</th><th>Trạng thái</th><th>Loại (dự đoán)</th><th class="num">Độ nảy kỳ vọng</th></tr></thead><tbody>'+
      D.plan.map(p=>'<tr><td class="mono">'+esc(p.d)+'</td>'+
        '<td>'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.name)+'</a>':esc(p.name))+'</td>'+
        '<td>'+(p.status=="planned"?'<span class="badge y">dự kiến</span>':'<span class="badge g">đã ra</span>')+'</td>'+
        '<td>'+esc(p.pat||"chưa phân loại")+'</td>'+
        '<td class="num">'+(p.exp_lm!=null&&p.usable?fMult(p.exp_lm):'<span class="muted">—</span>')+'</td></tr>').join("")+
      '</tbody></table></div>'+
      '<p class="muted" style="font-size:11px;margin:8px 0 0">Loại "Phó bản/Dungeon" hiện chưa đủ mẫu sạch → không hiện kỳ vọng để tránh số ảo.</p></div>';
  }
  document.getElementById("t4").innerHTML=h;
}

/* ---------------- init ---------------- */
buildTabs();
renderHeader();
renderOverview();
renderTimelineShell();
renderImpactShell();
renderLibraryShell();
renderForecast();
</script>
</body></html>
