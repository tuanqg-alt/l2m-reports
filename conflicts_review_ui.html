<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Conflicts Review — L2M Glossary KB</title>
<style>
:root {
  --bg: #0f1117; --bg2: #1a1d27; --bg3: #22263a;
  --border: #2e3250; --border2: #3d4270;
  --text: #e2e6f0; --text2: #8890b0; --text3: #555d80;
  --blue: #4f8ef7; --green: #3ecf8e; --yellow: #f5c842;
  --red: #f75555; --orange: #f7944a; --purple: #a78bfa;
  --major: #f75555; --moderate: #f5c842; --minor: #3ecf8e;
  --radius: 8px; --radius-sm: 5px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 14px; line-height: 1.5;
}

/* ── Header ── */
.header {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 16px 24px; position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.header h1 { font-size: 16px; font-weight: 700; color: var(--blue); white-space: nowrap; }
.progress-wrap { display: flex; align-items: center; gap: 10px; }
.progress-bar { width: 160px; height: 8px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }
.progress-label { font-size: 13px; color: var(--text2); white-space: nowrap; }
.header-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

/* ── Buttons ── */
.btn {
  padding: 7px 14px; border-radius: var(--radius-sm); border: none;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .1s;
  white-space: nowrap;
}
.btn:hover { opacity: .85; }
.btn:active { transform: scale(.97); }
.btn-green  { background: var(--green); color: #0a2a1e; }
.btn-blue   { background: var(--blue); color: #fff; }
.btn-orange { background: var(--orange); color: #fff; }
.btn-ghost  { background: transparent; color: var(--text2); border: 1px solid var(--border2); }

/* ── Filters ── */
.filters {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 10px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.search-box {
  background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text); padding: 6px 12px; font-size: 13px; width: 220px; outline: none;
}
.search-box:focus { border-color: var(--blue); }
.filter-select {
  background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text); padding: 6px 10px; font-size: 13px; outline: none; cursor: pointer;
}
.sev-chips { display: flex; gap: 6px; }
.chip {
  padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
  cursor: pointer; border: 2px solid transparent; transition: all .15s; user-select: none;
}
.chip-MAJOR    { background: #2a1010; color: var(--major); border-color: #4a1a1a; }
.chip-MODERATE { background: #2a2210; color: var(--moderate); border-color: #4a3a10; }
.chip-MINOR    { background: #0a2a1a; color: var(--minor); border-color: #1a4a2a; }
.chip.active   { opacity: 1; }
.chip.inactive { opacity: .4; }
.filter-label { font-size: 12px; color: var(--text3); }
.result-count { margin-left: auto; font-size: 12px; color: var(--text3); white-space: nowrap; }

/* ── Table ── */
.table-wrap { padding: 16px 24px; }
table { width: 100%; border-collapse: collapse; }
th {
  background: var(--bg3); color: var(--text2); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em;
  padding: 8px 10px; border-bottom: 2px solid var(--border2); text-align: left;
  white-space: nowrap;
}
tr.row {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
tr.row:hover { background: var(--bg2); }
tr.row.hidden { display: none; }
tr.row.filled td.decision-cell .dec-input { border-color: var(--green); }
td { padding: 9px 10px; vertical-align: top; }

/* Severity badge */
.sev-badge {
  display: inline-block; padding: 2px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.sev-MAJOR    { background: #2a1010; color: var(--major); }
.sev-MODERATE { background: #2a2210; color: var(--moderate); }
.sev-MINOR    { background: #0a2a1a; color: var(--minor); }

.cat-tag {
  display: inline-block; background: var(--bg3); color: var(--purple);
  padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
}
.kr-text { font-weight: 700; color: var(--text); font-size: 14px; }
.suggest-text { color: var(--green); font-weight: 700; }
.opts-list { color: var(--text2); font-size: 12px; white-space: pre-line; line-height: 1.7; }
.reason-text { color: var(--text3); font-size: 12px; }
.anchor-text { color: var(--orange); font-size: 11px; margin-top: 3px; }

/* Decision input */
.decision-cell { min-width: 180px; }
.dec-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); color: var(--text);
  padding: 6px 10px; font-size: 13px; outline: none;
  transition: border-color .15s;
}
.dec-input:focus { border-color: var(--blue); }
.dec-input.has-value { border-color: var(--green); }
.use-suggest {
  margin-top: 4px; font-size: 11px; color: var(--blue);
  cursor: pointer; text-decoration: underline; display: block;
}
.use-suggest:hover { color: var(--green); }

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 24px;
  color: var(--text3); font-size: 15px;
  display: none;
}

/* Export result */
#export-msg {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--green); color: #0a2a1e;
  padding: 10px 18px; border-radius: var(--radius); font-weight: 700;
  font-size: 13px; display: none; z-index: 999;
  animation: fadeup .3s ease;
}
@keyframes fadeup {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <h1>📖 Conflicts Review — L2M Glossary KB &nbsp;<span style="color:var(--text3);font-weight:400;font-size:13px">2026-05-15 · 558 conflicts</span></h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="pbar" style="width:0%"></div></div>
    <span class="progress-label" id="plabel">0 / 558 filled</span>
  </div>
  <div class="header-actions">
    <button class="btn btn-green" onclick="acceptAll(false)" title="Điền Claude Suggest vào mọi ô còn trống">✅ Accept All (empty)</button>
    <button class="btn btn-orange" onclick="acceptAll(true)" title="Ghi đè toàn bộ bằng Claude Suggest">⚡ Accept All (overwrite)</button>
    <button class="btn btn-ghost" onclick="clearAll()">✕ Clear All</button>
    <button class="btn btn-blue" onclick="exportJSON()">⬇ Export decisions.json</button>
  </div>
</div>

<!-- ── Filters ── -->
<div class="filters">

    <span class="chip chip-MINOR active"   id="chip-MINOR"    onclick="toggleChip('MINOR')">MINOR</span>
  </div>
  <select class="filter-select" id="cat-filter" onchange="applyFilters()">
    <option value="">All Categories</option>
    <option value="ACTIVE_SKILL">ACTIVE_SKILL</option><option value="ARTIFACT">ARTIFACT</option><option value="CLASS">CLASS</option><option value="EQUIPMENT">EQUIPMENT</option><option value="ITEM">ITEM</option><option value="MATERIAL">MATERIAL</option><option value="SYSTEM">SYSTEM</option><option value="UI">UI</option><option value="WEAPON_SKILL">WEAPON_SKILL</option>
  </select>
  <input class="search-box" type="text" id="search-box" placeholder="🔍 Search KR / VN..." oninput="applyFilters()">
  <span class="result-count" id="result-count"></span>
</div>

<!-- ── Table ── -->
<div class="table-wrap">
<table id="main-table">
<thead>
<tr>

  <th style="width:90px">Severity</th>
  <th style="width:110px">Category</th>
  <th style="width:140px">KR</th>
  <th style="width:220px">VN Options</th>
  <th style="width:130px">Claude Suggest</th>
  <th style="width:170px">Reason / Anchor</th>
  <th style="width:190px">Decision ✏️</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>
<div class="empty-state" id="empty-state">Không tìm thấy kết quả phù hợp.</div>
</div>

<div id="export-msg">✅ Đã tải decisions.json!</div>

const TOTAL = 558;

// State
let decisions = {};
let sevFilter = new Set(['MAJOR','MODERATE','MINOR']);

// Init: load saved decisions from localStorage, then pre-fill from xlsx
(function init() {
  const saved = localStorage.getItem('l2m_decisions_v1');
  if (saved) {
    try { decisions = JSON.parse(saved); } catch(e) {}
  }
  // Pre-fill from xlsx data (already filled by user previously)
  ROWS.forEach(r => {
    const key = r.kr + '||' + r.category;
    if (!decisions[key] && r.decision) decisions[key] = r.decision;
  });
  renderTable();
  updateProgress();
})();

// ─── Render ───────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  ROWS.forEach(r => {
    const key = r.kr + '||' + r.category;
    const dec = decisions[key] || '';
    const opts = r.vn_opts.split('\n').map(o => o.trim()).filter(Boolean);
    const optsHtml = opts.map(o => `<div>${escHtml(o)}</div>`).join('');
    const anchorHtml = r.anchor
      ? `<div class="anchor-text">⚠ ${escHtml(r.anchor)}</div>` : '';

    const tr = document.createElement('tr');
    tr.className = 'row';
    tr.dataset.sev = r.severity;
    tr.dataset.cat = r.category;
    tr.dataset.kr  = r.kr.toLowerCase();
    tr.dataset.key = key;
    if (dec) tr.classList.add('filled');

    tr.innerHTML = `
      <td style="color:var(--text3);font-size:12px">${r.idx}</td>
      <td><span class="sev-badge sev-${r.severity}">${r.severity}</span></td>
      <td><span class="cat-tag">${escHtml(r.category)}</span></td>
      <td class="kr-text">${escHtml(r.kr)}</td>
      <td><div class="opts-list">${optsHtml}</div></td>
      <td><span class="suggest-text">${escHtml(r.suggest)}</span></td>
      <td>
        <div class="reason-text">${escHtml(r.reason)}</div>
        ${anchorHtml}
      </td>
      <td class="decision-cell">
        <input class="dec-input ${dec ? 'has-value' : ''}"
               type="text"
               value="${escHtml(dec)}"
               placeholder="${escHtml(r.suggest)}"
               data-key="${key}"
               oninput="onDecisionInput(this)">
        <span class="use-suggest" onclick="useSuggest('${key}', '${escJs(r.suggest)}')">← dùng gợi ý Claude</span>
      </td>`;
    tbody.appendChild(tr);
  });
  applyFilters();
}

// ─── Input handler ────────────────────────────────────────────────────────
function onDecisionInput(input) {
  const key = input.dataset.key;
  const val = input.value.trim();
  if (val) {
    decisions[key] = val;
    input.classList.add('has-value');
    input.closest('tr').classList.add('filled');
  } else {
    delete decisions[key];
    input.classList.remove('has-value');
    input.closest('tr').classList.remove('filled');
  }
  saveLocal();
  updateProgress();
}

function useSuggest(key, suggest) {
  const input = document.querySelector(`input[data-key="${key}"]`);
  if (input) {
    input.value = suggest;
    decisions[key] = suggest;
    input.classList.add('has-value');
    input.closest('tr').classList.add('filled');
    saveLocal();
    updateProgress();
  }
}

// ─── Accept All / Clear ───────────────────────────────────────────────────
function acceptAll(overwrite) {
  ROWS.forEach(r => {
    const key = r.kr + '||' + r.category;
    if (overwrite || !decisions[key]) {
      decisions[key] = r.suggest;
    }
  });
  // Update all visible inputs
  document.querySelectorAll('.dec-input').forEach(input => {
    const key = input.dataset.key;
    if (decisions[key]) {
      input.value = decisions[key];
      input.classList.add('has-value');
      input.closest('tr').classList.add('filled');
    }
  });
  saveLocal();
  updateProgress();
}

function clearAll() {
  if (!confirm('Xóa toàn bộ decisions đã nhập?')) return;
  decisions = {};
  document.querySelectorAll('.dec-input').forEach(input => {
    input.value = '';
    input.classList.remove('has-value');
    input.closest('tr').classList.remove('filled');
  });
  saveLocal();
  updateProgress();
}

// ─── Filters ─────────────────────────────────────────────────────────────
function toggleChip(sev) {
  if (sevFilter.has(sev)) sevFilter.delete(sev);
  else sevFilter.add(sev);
  document.getElementById('chip-' + sev).className =
    `chip chip-${sev} ${sevFilter.has(sev) ? 'active' : 'inactive'}`;
  applyFilters();
}

function applyFilters() {
  const cat    = document.getElementById('cat-filter').value;
  const search = document.getElementById('search-box').value.toLowerCase();
  let visible  = 0;
  document.querySelectorAll('tr.row').forEach(tr => {
    const show =
      sevFilter.has(tr.dataset.sev) &&
      (!cat || tr.dataset.cat === cat) &&
      (!search || tr.dataset.kr.includes(search) ||
       (decisions[tr.dataset.key] || '').toLowerCase().includes(search));
    tr.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  document.getElementById('result-count').textContent =
    visible === TOTAL ? `${TOTAL} rows` : `${visible} / ${TOTAL} rows`;
  document.getElementById('empty-state').style.display = visible === 0 ? 'block' : 'none';
}

// ─── Progress ─────────────────────────────────────────────────────────────
function updateProgress() {
  const filled = Object.keys(decisions).length;
  const pct    = Math.round(filled / TOTAL * 100);
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('plabel').textContent = `${filled} / ${TOTAL} filled (${pct}%)`;
}

// ─── LocalStorage ─────────────────────────────────────────────────────────
function saveLocal() {
  try { localStorage.setItem('l2m_decisions_v1', JSON.stringify(decisions)); } catch(e) {}
}

// ─── Export JSON ──────────────────────────────────────────────────────────
function exportJSON() {
  const out = ROWS.map(r => {
    const key = r.kr + '||' + r.category;
    return { kr: r.kr, category: r.category, decision: decisions[key] || '' };
  });
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'decisions.json'; a.click();
  URL.revokeObjectURL(url);
  const msg = document.getElementById('export-msg');
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; }, 2500);
}

// ─── Helpers ──────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJs(s) {
  return String(s||'').replace(/\/g,'\\').replace(/'/g,"\'");
}
</script>
</body>
</html>
